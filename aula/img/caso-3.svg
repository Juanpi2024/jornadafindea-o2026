<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Dos puestos de trabajo en la misma sala: en uno la guía ya terminada y el celular encima, en el otro la guía a medias y un reloj de arena">
  <rect width="640" height="360" fill="#EAF2FA"/>
  <path d="M0 274h640v86H0z" fill="#DCE7F2"/>
  <path d="M320 40v300" stroke="#C3D6E8" stroke-width="3" stroke-dasharray="8 8"/>
  <!-- puesto izquierdo: termino antes -->
  <rect x="44" y="214" width="232" height="16" rx="4" fill="#B9CFE5"/>
  <rect x="66" y="230" width="14" height="52" fill="#9DBAD4"/>
  <rect x="240" y="230" width="14" height="52" fill="#9DBAD4"/>
  <rect x="86" y="150" width="104" height="64" rx="3" fill="#FBFDFF" stroke="#0F8A5F" stroke-width="3"/>
  <path d="M104 172h68M104 186h52" stroke="#C3D6E8" stroke-width="4" stroke-linecap="round"/>
  <path d="M152 196l12 12 22-26" stroke="#0F8A5F" stroke-width="5" fill="none" stroke-linecap="round"/>
  <rect x="198" y="164" width="34" height="56" rx="6" fill="#3B5A76"/>
  <rect x="203" y="170" width="24" height="42" rx="2" fill="#63B3ED"/>
  <text x="160" y="118" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0F8A5F">Terminó 20' antes</text>
  <text x="160" y="140" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#4E6275">sin tarea de extensión</text>
  <!-- puesto derecho: necesita mas tiempo -->
  <rect x="364" y="214" width="232" height="16" rx="4" fill="#B9CFE5"/>
  <rect x="386" y="230" width="14" height="52" fill="#9DBAD4"/>
  <rect x="560" y="230" width="14" height="52" fill="#9DBAD4"/>
  <rect x="406" y="150" width="104" height="64" rx="3" fill="#FBFDFF" stroke="#C77A00" stroke-width="3"/>
  <path d="M424 172h68M424 186h52M424 200h30" stroke="#C3D6E8" stroke-width="4" stroke-linecap="round"/>
  <!-- reloj de arena -->
  <path d="M524 158h44l-22 26 22 26h-44l22-26z" fill="#F6AD55" stroke="#8F5A00" stroke-width="3"/>
  <path d="M520 154h52M520 214h52" stroke="#8F5A00" stroke-width="5" stroke-linecap="round"/>
  <text x="480" y="118" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#C77A00">Necesita más tiempo</text>
  <text x="480" y="140" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#4E6275">guía sin apoyo visual</text>
  <text x="320" y="320" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#4E6275">Indicadores 1.1.2 y 1.1.3 &#183; asincronía de ritmos y DUA</text>
</svg>
