<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Dos puestos de trabajo de la misma sala, uno con el desafío de extensión y otro con el apoyo previsto">
  <rect width="640" height="360" fill="#EAF2FA"/>
  <path d="M0 280h640v80H0z" fill="#DCE7F2"/>
  <text x="320" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0F2C47">La misma clase, para los dos ritmos</text>
  <path d="M320 70v212" stroke="#C3D6E8" stroke-width="3" stroke-dasharray="8 8"/>
  <!-- izquierda: terminó antes -->
  <text x="162" y="100" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#0F8A5F">Terminó antes</text>
  <text x="162" y="122" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#4E6275">desafío al reverso de la guía</text>
  <rect x="50" y="222" width="224" height="16" rx="4" fill="#B9CFE5"/>
  <rect x="72" y="238" width="14" height="50" fill="#9DBAD4"/>
  <rect x="238" y="238" width="14" height="50" fill="#9DBAD4"/>
  <rect x="78" y="156" width="96" height="66" rx="3" fill="#FBFDFF" stroke="#0F8A5F" stroke-width="3"/>
  <path d="M94 178h62M94 192h44" stroke="#C3D6E8" stroke-width="4" stroke-linecap="round"/>
  <path d="M138 202l11 11 20-24" stroke="#0F8A5F" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="186" y="156" width="76" height="66" rx="3" fill="#E8F6EF" stroke="#0F8A5F" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="224" y="186" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#0F8A5F">DESAFÍO</text>
  <text x="224" y="202" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#0F8A5F">LABORAL</text>
  <!-- derecha: necesita más tiempo -->
  <text x="478" y="100" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#015EA9">Necesita más tiempo</text>
  <text x="478" y="122" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#4E6275">apoyo previsto y guía en macrotipo</text>
  <rect x="366" y="222" width="224" height="16" rx="4" fill="#B9CFE5"/>
  <rect x="388" y="238" width="14" height="50" fill="#9DBAD4"/>
  <rect x="554" y="238" width="14" height="50" fill="#9DBAD4"/>
  <rect x="394" y="156" width="96" height="66" rx="3" fill="#FBFDFF" stroke="#015EA9" stroke-width="3"/>
  <rect x="404" y="168" width="30" height="20" rx="3" fill="#CFE2F3"/>
  <path d="M442 176h38M404 198h76M404 210h52" stroke="#C3D6E8" stroke-width="5" stroke-linecap="round"/>
  <rect x="502" y="156" width="76" height="66" rx="3" fill="#EAF2FA" stroke="#015EA9" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="540" y="186" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#015EA9">APOYO</text>
  <text x="540" y="202" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#015EA9">ACORDADO</text>
  <text x="320" y="326" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#4E6275">Mismo objetivo, misma exigencia, distinto camino</text>
</svg>
