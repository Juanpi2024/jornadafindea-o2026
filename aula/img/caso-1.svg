<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Pizarra con la ruta de la clase repartida en cuatro tramos y un reloj marcando el corte antes del timbre">
  <rect width="640" height="360" fill="#EAF2FA"/>
  <path d="M0 274h640v86H0z" fill="#DCE7F2"/>
  <!-- pizarra -->
  <rect x="40" y="44" width="340" height="212" rx="6" fill="#FBFDFF" stroke="#015EA9" stroke-width="3"/>
  <rect x="40" y="246" width="340" height="10" rx="3" fill="#CFE2F3"/>
  <text x="64" y="80" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#0F2C47">Ruta de la clase</text>
  <rect x="64" y="96" width="46" height="18" rx="5" fill="#015EA9"/>
  <text x="122" y="110" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#3B5A76">12&#8242; activación</text>
  <rect x="64" y="128" width="96" height="18" rx="5" fill="#0F8A5F"/>
  <text x="172" y="142" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#3B5A76">25&#8242; trabajo</text>
  <rect x="64" y="160" width="96" height="18" rx="5" fill="#0F8A5F"/>
  <text x="172" y="174" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#3B5A76">25&#8242; trabajo</text>
  <rect x="64" y="192" width="40" height="18" rx="5" fill="#C77A00"/>
  <text x="116" y="206" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#8F5A00">10&#8242; cierre blindado</text>
  <text x="64" y="232" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#4E6275">la ruta queda a la vista junto al objetivo</text>
