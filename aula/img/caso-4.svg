<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="La cadena que va del pedido de material a la bodega, a la sala preparada y al timbre">
  <rect width="640" height="360" fill="#EAF2FA"/>
  <path d="M0 290h640v70H0z" fill="#DCE7F2"/>
  <text x="320" y="46" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0F2C47">La clase empieza mucho antes del timbre</text>
  <!-- linea de la cadena -->
  <path d="M86 168h468" stroke="#C3D6E8" stroke-width="5" stroke-linecap="round"/>
  <!-- 1 pedido -->
  <circle cx="86" cy="168" r="34" fill="#FBFDFF" stroke="#8A4B20" stroke-width="3"/>
  <rect x="70" y="152" width="32" height="30" rx="3" fill="#FFF" stroke="#8A4B20" stroke-width="2.5"/>
  <path d="M77 161h18M77 168h18M77 175h11" stroke="#C3D6E8" stroke-width="3" stroke-linecap="round"/>
  <text x="86" y="226" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#8A4B20">el pedido</text>
  <text x="86" y="244" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#4E6275">un canal, un plazo</text>
  <!-- 2 bodega -->
  <circle cx="203" cy="168" r="34" fill="#FBFDFF" stroke="#8A4B20" stroke-width="3"/>
  <path d="M185 180v-20l18-11 18 11v20z" fill="#E2D2BE" stroke="#8A4B20" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="196" y="166" width="14" height="14" fill="#C77A00"/>
  <text x="203" y="226" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#8A4B20">bodega y copias</text>
  <text x="203" y="244" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#4E6275">confirmar con fecha</text>
  <!-- 3 sala -->
  <circle cx="320" cy="168" r="34" fill="#FBFDFF" stroke="#015EA9" stroke-width="3"/>
  <rect x="302" y="154" width="36" height="24" rx="3" fill="#CFE2F3" stroke="#015EA9" stroke-width="2.5"/>
  <path d="M307 184h26" stroke="#015EA9" stroke-width="3" stroke-linecap="round"/>
  <text x="320" y="226" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#015EA9">la sala entregada</text>
  <text x="320" y="244" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#4E6275">condición mínima</text>
  <!-- 4 interrupcion -->
  <circle cx="437" cy="168" r="34" fill="#FBFDFF" stroke="#C77A00" stroke-width="3"/>
  <rect x="424" y="150" width="22" height="34" rx="2" fill="#FFF" stroke="#C77A00" stroke-width="2.5"/>
  <circle cx="442" cy="168" r="2.6" fill="#C77A00"/>
  <path d="M455 158l10-6M455 168h11M455 178l10 6" stroke="#C77A00" stroke-width="2.5" stroke-linecap="round"/>
  <text x="437" y="226" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#8F5A00">la interrupción</text>
  <text x="437" y="244" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#4E6275">contarlas 1 semana</text>
  <!-- 5 timbre -->
  <circle cx="554" cy="168" r="34" fill="#FBFDFF" stroke="#0F8A5F" stroke-width="3"/>
  <path d="M538 176c0-11 8-19 16-19s16 8 16 19z" fill="#0F8A5F"/>
  <rect x="534" y="176" width="40" height="6" rx="3" fill="#0B6B4F"/>
  <path d="M554 157v-6" stroke="#0B6B4F" stroke-width="3" stroke-linecap="round"/>
  <text x="554" y="226" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#0F8A5F">el aviso de corte</text>
  <text x="554" y="244" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#4E6275">12&#8242; antes</text>
  <text x="320" y="326" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#4E6275">4 de 10 clases perdieron minutos por algo que pasó fuera de la sala</text>
</svg>
