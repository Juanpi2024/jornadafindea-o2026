  <path d="M0 272h640v88H0z" fill="#DCE7F2"/>
  <!-- meson -->
  <rect x="40" y="206" width="560" height="18" rx="4" fill="#8A4B20"/>
  <rect x="62" y="224" width="16" height="64" fill="#6E3A18"/>
  <rect x="562" y="224" width="16" height="64" fill="#6E3A18"/>
  <!-- carton -->
  <path d="M108 180h190l-16 26H92z" fill="#D9BE96" stroke="#8A4B20" stroke-width="2"/>
  <!-- corta carton -->
  <rect x="136" y="160" width="104" height="16" rx="4" fill="#3B5A76"/>
  <path d="M240 162l40 6-40 6z" fill="#C62828"/>
  <!-- pistola de silicona -->
  <path d="M352 150h86v26h-24l-8 44h-26l6-44h-34z" fill="#C77A00" stroke="#8F5A00" stroke-width="2"/>
  <path d="M438 158h36v10h-36z" fill="#8F5A00"/>
  <circle cx="482" cy="163" r="7" fill="#C62828"/>
  <path d="M492 156c6 0 10 3 12 7" stroke="#C62828" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- caja de lentes cerrada -->
  <rect x="506" y="156" width="108" height="50" rx="6" fill="#FBFDFF" stroke="#015EA9" stroke-width="3"/>
  <path d="M506 174h108" stroke="#C3D6E8" stroke-width="3"/>
  <text x="560" y="194" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#015EA9">EPP &#183; cerrada</text>
  <!-- aviso -->
  <path d="M84 56l34 58H50z" fill="#FFF00F" stroke="#8F5A00" stroke-width="3"/>
  <path d="M84 76v18" stroke="#8F5A00" stroke-width="5" stroke-linecap="round"/>
  <circle cx="84" cy="104" r="3.5" fill="#8F5A00"/>
  <text x="140" y="86" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0F2C47">Sin inducción previa</text>
  <text x="140" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#4E6275">Indicador 1.1.4 &#183; promedio 2,0 &#183; el más bajo del ciclo</text>
</svg>
