<!doctype html><html lang="es-CL"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RICE CEIA | Presentación general narrada</title><style>*{box-sizing:border-box}body{margin:0;background:#e7eff0;color:#14333e;font:17px Arial,sans-serif}main{max-width:1300px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;font-weight:bold;color:#185e64;gap:15px}.slide{margin-top:18px;background:white;border-top:10px solid #187b76;border-radius:12px;padding:clamp(20px,4vw,55px);min-height:480px}h1{font-size:clamp(24px,3.5vw,48px);margin:12px 0 25px}.tag{color:#197970;font-weight:bold;font-size:14px;letter-spacing:1px}#body{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{padding:10px 14px;background:#eef6f5;border-left:4px solid #79aea9;line-height:1.4}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}button,select{font:inherit;padding:10px;border:1px solid #b4c9cd;background:white;border-radius:7px;color:#153b45}button.primary{background:#176f6e;color:white;font-weight:bold}audio{width:100%;margin-top:16px}details{margin-top:15px;background:white;padding:16px;border-radius:8px}summary{cursor:pointer}#status{font-size:14px;color:#426168}.dense{font-size:14px}#bar{height:6px;background:#c3d7d8;border-radius:4px;margin-top:15px}#fill{height:100%;background:#187b76;border-radius:4px}select{max-width:320px}@media(max-width:650px){main{padding:12px}#body{grid-template-columns:1fr}.slide{min-height:300px}}.part-nav{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 0}.part-nav button{flex:1;min-width:200px;text-align:left;cursor:pointer}.part-nav button strong,.part-nav button small{display:block}.part-nav button small{margin-top:5px;font-size:13px}.part-nav button[aria-pressed="true"]{background:#176f6e;color:white;border-color:#176f6e}.part-nav button:focus-visible{outline:3px solid #cf951d;outline-offset:3px}</style><body><main><p><a href="../index.html" style="color:#185e64">← Volver a las jornadas</a></p><header><span>CEIA JUANITA ZÚÑIGA FUENTES · PARRAL</span><span id="count"></span></header><nav class="part-nav" aria-label="Comenzar desde una parte"><button id="partA"><strong>Comenzar parte A</strong><small>Comunidad y funcionamiento</small></button><button id="partB"><strong>Comenzar parte B</strong><small>Seguridad y convivencia</small></button><button id="partC"><strong>Comenzar parte C</strong><small>Protocolos y anexos</small></button></nav><section class="slide"><div class="tag" id="tag"></div><h1 id="title"></h1><div id="body"></div><p id="source" style="font-size:13px;color:#426168;margin-top:24px"></p></section><div id="bar"><div id="fill"></div></div><audio id="audio" controls preload="metadata"></audio><div class="controls"><button id="prev">← Anterior</button><button class="primary" id="play">Reproducir</button><button id="next">Siguiente →</button><button id="full">Pantalla completa</button><label><input id="auto" type="checkbox" checked> Avance automático</label><select id="jump"></select></div><p id="status" role="status"></p><details><summary>Transcripción de la narración</summary><p id="speech"></p></details></main><script>const slides=[{"tag":"EDUCACIÓN DE PERSONAS JÓVENES Y ADULTAS","title":"Comunidad y funcionamiento","body":["Principios, derechos, jornadas, matrícula y organización del CEIA","Presentación general · Parte 1 de 3 · Capítulos 1 a 5"],"speech":"Bienvenidas y bienvenidos a la presentación general del Reglamento Interno y de Convivencia Escolar del CEIA Juanita Zúñiga Fuentes, de Parral. Este recorrido se divide en tres partes. Comenzaremos por los principios, los derechos y las responsabilidades de la comunidad, junto con las normas de funcionamiento. El propósito es comprender el documento y reconocer cómo orienta nuestro trabajo cotidiano.","audio":"audio/A01.mp3","source":"REGLAMENTO CEIA 2026–2027","code":"A01"},{"tag":"PARTE 1 DE 3   /   COMUNIDAD Y FUNCIONAMIENTO","title":"Cómo recorrer el reglamento","body":["Parte 1","Principios, comunidad y funcionamiento diario. Capítulos 1 a 5.","Parte 2","Seguridad, gestión pedagógica, medidas y convivencia. Capítulos 6 a 10.","Parte 3","Protocolos, procedimientos y formularios. Páginas 137 a 235."],"speech":"La presentación general tiene tres partes que se complementan. La primera aborda los capítulos 1 al 5, sobre comunidad y funcionamiento. La segunda revisa los capítulos 6 al 10, sobre seguridad, gestión pedagógica, medidas y convivencia. La tercera permite ubicar los protocolos, procedimientos y formularios. Podemos detenernos al terminar cada bloque para realizar las actividades y registrar nuestras dudas.","audio":"audio/A02.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 2–9","code":"A02"},{"tag":"PARTE 1 DE 3   /   COMUNIDAD Y FUNCIONAMIENTO","title":"Introducción y marco legal","body":["Propósito","El reglamento ordena la vida institucional y promueve una convivencia formativa, respetuosa y participativa.","Principios","Dignidad, interés superior de la niñez y adolescencia, igualdad de trato, transparencia y proporcionalidad.","Marco legal","El documento reúne referencias sobre EPJA, evaluación, convivencia, seguridad y protección de derechos."],"speech":"El reglamento organiza la vida institucional y promueve una convivencia formativa, respetuosa y participativa. Su lectura considera la dignidad de las personas, la igualdad de trato, la transparencia y la proporcionalidad. También reconoce el interés superior de la niñez y la adolescencia. El documento reúne referencias sobre educación de jóvenes y adultos, evaluación, seguridad y protección de derechos.","audio":"audio/A03.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 10–18","code":"A03"},{"tag":"PARTE 1 DE 3   /   COMUNIDAD Y FUNCIONAMIENTO","title":"Alcance y objetivos","body":["A quiénes se aplica","Estudiantes, familias y adultos responsables, docentes, asistentes, equipos directivos y demás integrantes de la comunidad.","Identidad EPJA","El CEIA de Parral atiende trayectorias diversas, incluidas personas que estudian mientras trabajan o cuidan a otros.","Objetivos","Orientar la convivencia, definir responsabilidades y acordar cómo actuar frente a situaciones que afectan la vida escolar."],"speech":"El reglamento se aplica a estudiantes, familias, adultos responsables, docentes, asistentes y equipos directivos. En nuestro centro conviven personas con trayectorias diversas, que muchas veces estudian mientras trabajan o cuidan a otros. Este contexto ayuda a comprender el propósito del documento: orientar la convivencia, definir responsabilidades y acordar cómo actuar ante situaciones que afectan la vida escolar.","audio":"audio/A04.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 19–23","code":"A04"},{"tag":"PARTE 1 DE 3   /   COMUNIDAD Y FUNCIONAMIENTO","title":"1 · Estudiantes","body":["Derechos","Recibir trato respetuoso, acceder a apoyos y participar en la vida educativa, cultural y recreativa.","Deberes","Asistir, respetar a quienes integran el CEIA, colaborar con la convivencia y cuidar espacios y materiales."],"speech":"El capítulo 1 presenta derechos y deberes de los estudiantes. Entre los derechos están recibir un trato respetuoso, acceder a apoyos y participar en la vida educativa, cultural y recreativa. Entre los deberes se encuentran asistir, respetar a los demás, colaborar con la convivencia y cuidar los espacios y materiales. Ambos aspectos orientan las relaciones cotidianas dentro del establecimiento.","audio":"audio/A05.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 24, 26–28","code":"A05"},{"tag":"PARTE 1 DE 3   /   COMUNIDAD Y FUNCIONAMIENTO","title":"1 · Docentes y equipo directivo","body":["Docentes","Ejercer su labor con respeto y colaboración. Tienen derecho a un ambiente de trabajo adecuado y a un trato digno.","Equipo directivo","Conducir el proyecto educativo y velar por el funcionamiento y la convivencia. Puede ejercer sus atribuciones dentro del marco institucional."],"speech":"Los docentes ejercen su labor con respeto y colaboración, y tienen derecho a un ambiente de trabajo adecuado y a un trato digno. El equipo directivo conduce el proyecto educativo y vela por el funcionamiento y la convivencia. Las atribuciones de cada equipo se ejercen dentro del marco institucional. Este apartado permite reconocer las responsabilidades asociadas a cada función.","audio":"audio/A06.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 25, 28","code":"A06"},{"tag":"PARTE 1 DE 3   /   COMUNIDAD Y FUNCIONAMIENTO","title":"1 · Asistentes y adultos responsables","body":["Asistentes de la educación","Apoyar el funcionamiento del CEIA y la seguridad de los estudiantes. Tienen derecho a trato digno y a participar según sus funciones.","Padres, madres y tutores","Acompañar la trayectoria de menores de edad, responder a citaciones y mantener contacto con el establecimiento. Pueden solicitar información y ser escuchados."],"speech":"Los asistentes de la educación apoyan el funcionamiento del centro y la seguridad de los estudiantes. El reglamento reconoce su derecho al trato digno y a participar según sus funciones. Padres, madres y tutores acompañan la trayectoria de los menores de edad, responden a citaciones y mantienen contacto con el establecimiento. También pueden solicitar información y ser escuchados.","audio":"audio/A07.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 26, 28–29","code":"A07"},{"tag":"PARTE 1 DE 3   /   COMUNIDAD Y FUNCIONAMIENTO","title":"1 · Roles y coordinación","body":["Dirección y UTP","Dirección conduce la gestión institucional. UTP coordina la gestión curricular y el acompañamiento pedagógico.","Inspectoría y convivencia","Inspectoría coordina el funcionamiento de la jornada. Convivencia y la dupla psicosocial apoyan la prevención, la intervención y el seguimiento.","Docentes y asistentes","Sostienen el trabajo de aula y de taller, la orientación a estudiantes y el funcionamiento de los espacios."],"speech":"La Dirección conduce la gestión institucional. La Unidad Técnico Pedagógica coordina el trabajo curricular y el acompañamiento pedagógico. Inspectoría organiza el funcionamiento de la jornada, mientras Convivencia y la dupla psicosocial apoyan la prevención, la intervención y el seguimiento. Docentes y asistentes sostienen el trabajo de aula, los talleres y los espacios educativos. La coordinación entre estas funciones permite dar continuidad a la atención.","audio":"audio/A08.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 29–49","code":"A08"},{"tag":"PARTE 1 DE 3   /   COMUNIDAD Y FUNCIONAMIENTO","title":"2.1 y 2.2 · Niveles y jornadas","body":["Modalidades","Básica de adultos con oficios y media de adultos humanístico-científica y técnico-profesional.","Tres jornadas","Mañana, tarde y vespertina. Cada jornada tiene su propio horario y recreos."],"speech":"El establecimiento contempla educación básica de adultos con oficios y educación media de adultos, tanto humanístico científica como técnico profesional. Su funcionamiento se distribuye en tres jornadas: mañana, tarde y vespertina. Cada una tiene horarios y recreos propios. Al consultar una situación de asistencia o funcionamiento, debemos ubicar la jornada que corresponde dentro del documento.","audio":"audio/A09.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 50–51","code":"A09"},{"tag":"PARTE 1 DE 3   /   COMUNIDAD Y FUNCIONAMIENTO","title":"2.3 · Horarios y cambios de actividades","body":["Horarios del reglamento","Mañana 08:30–13:15. Tarde 14:00–18:45. Vespertina 19:00–23:40. La página 51 detalla cada bloque y recreo.","Suspensión y cambios","El texto contempla la suspensión por situaciones excepcionales y establece cómo tramitarla. Los cambios de actividades se consideran en la planificación anual."],"speech":"Los horarios consignados en el reglamento son de 8:30 a 13:15 para la mañana, de 14:00 a 18:45 para la tarde y de 19:00 a 23:40 para la jornada vespertina. La página 51 detalla los bloques y recreos. El mismo apartado aborda las suspensiones excepcionales y los cambios de actividades considerados en la planificación anual.","audio":"audio/A10.mp3","source":"Reglamento CEIA 2026–2027  /  p. 51","code":"A10"},{"tag":"PARTE 1 DE 3   /   COMUNIDAD Y FUNCIONAMIENTO","title":"2.3 · Ingreso, atrasos e inasistencias","body":["Ingreso y atrasos","Entrada principal y registro en portería o Inspectoría. El reglamento distingue entre mayores y menores de edad y contempla autorizaciones especiales.","Inasistencia","Al quinto día consecutivo, profesoría jefa informa para activar el protocolo. Las justificaciones de salud se presentan en Inspectoría."],"speech":"El ingreso se realiza por la entrada principal, con registro en portería o Inspectoría. El reglamento distingue entre estudiantes mayores y menores de edad, y contempla autorizaciones especiales. Ante cinco días consecutivos de inasistencia, la profesoría jefa informa para activar el protocolo. Las justificaciones de salud se presentan en Inspectoría. Para resolver situaciones particulares, corresponde consultar las condiciones completas del apartado.","audio":"audio/A11.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 52–54","code":"A11"},{"tag":"PARTE 1 DE 3   /   COMUNIDAD Y FUNCIONAMIENTO","title":"2.3 · Retiros, funcionarios y visitas","body":["Retiros","La persona adulta solicita autorización. Si el estudiante es menor de edad, lo retira su adulto responsable. En ambos casos queda registro.","Funcionarios y visitas","El personal registra ingreso y salida. Portería identifica a las visitas, registra el motivo y controla la salida."],"speech":"El retiro anticipado requiere autorización y registro. Si el estudiante es mayor de edad, solicita la autorización personalmente. Si es menor de edad, lo retira su adulto responsable. El personal registra sus ingresos y salidas. Por su parte, portería identifica a las visitas, registra el motivo de ingreso y controla la salida. Estos registros permiten respaldar el funcionamiento de la jornada.","audio":"audio/A12.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 54–55","code":"A12"},{"tag":"PARTE 1 DE 3   /   COMUNIDAD Y FUNCIONAMIENTO","title":"2.4 y 2.5 · Organigrama y comunicación","body":["Organigrama","La página 56 permite ubicar los roles y la coordinación entre equipos.","Comunicación","Entrevistas, circulares, teléfono, mensajería, correo institucional y carta certificada según el propósito. Las citaciones deben quedar registradas."],"speech":"El organigrama de la página 56 permite ubicar los roles y las relaciones de coordinación. Para comunicarse, el establecimiento utiliza entrevistas, circulares, teléfono, mensajería, correo institucional y carta certificada, según el propósito. Las citaciones deben quedar registradas. La actividad de este bloque invita a reconocer qué canal corresponde utilizar y quién debe recibir la información.","audio":"audio/A13.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 56–57","code":"A13"},{"tag":"PARTE 1 DE 3   /   COMUNIDAD Y FUNCIONAMIENTO","title":"3 · Admisión y matrícula","body":["Ingreso regular","El documento señala 15 años para Básica y 17 para Media al 30 de junio. Detalla documentos y firma de la matrícula de menores de edad.","Ingreso excepcional","Dirección analiza antecedentes en los casos previstos. El reglamento distingue ingreso por edad, derivación judicial y continuidad de estudios.","Matrícula durante el año","UTP evalúa la viabilidad pedagógica. Según el período, puede requerirse diagnóstico, nivelación o informe técnico-pedagógico."],"speech":"El capítulo de admisión y matrícula describe requisitos de ingreso, documentación y situaciones excepcionales. La presentación resume las edades indicadas en el documento: 15 años para básica y 17 para media, al 30 de junio. También aborda derivaciones judiciales y continuidad de estudios. Para la matrícula durante el año, la Unidad Técnico Pedagógica evalúa la viabilidad pedagógica y los antecedentes que correspondan al período.","audio":"audio/A14.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 58–61","code":"A14"},{"tag":"PARTE 1 DE 3   /   COMUNIDAD Y FUNCIONAMIENTO","title":"4 y 5 · Pagos, becas y uniforme","body":["Capítulo 4","El texto establece que el CEIA no cobra por la matrícula.","Capítulo 5","El establecimiento no contempla el uso de uniforme escolar."],"speech":"Los capítulos 4 y 5 presentan dos condiciones de funcionamiento del establecimiento. El texto señala que el centro no cobra por la matrícula y que no contempla el uso de uniforme escolar. Estas disposiciones forman parte de la información que debe conocer la comunidad educativa. Con este apartado cerramos la revisión de los primeros cinco capítulos.","audio":"audio/A15.mp3","source":"Reglamento CEIA 2026–2027  /  p. 62","code":"A15"},{"tag":"TRABAJO EN GRUPO","title":"¿Qué canal usarías?","body":["Caso ficticio","Una estudiante debe retirarse antes de clases por una responsabilidad de cuidado. Otra persona consulta si todavía puede matricularse en septiembre.","Conversación","¿Quién atiende cada solicitud? ¿Qué dato debe quedar registrado y qué antecedentes se deben revisar?"],"speech":"Hagamos una pausa para trabajar con dos situaciones ficticias. Una estudiante necesita retirarse antes del término de clases por una responsabilidad de cuidado. Otra persona consulta si todavía puede matricularse en septiembre. Desde tu función, identifica quién atiende cada solicitud, qué información debe registrarse y qué antecedentes se necesitan revisar. Puedes pausar la presentación para elaborar tus respuestas y consultar las páginas señaladas.","audio":"audio/A16.mp3","source":"Reglamento CEIA 2026–2027  /  Actividad · pp. 52–61","code":"A16"},{"tag":"EDUCACIÓN DE PERSONAS JÓVENES Y ADULTAS","title":"Seguridad y convivencia","body":["Gestión pedagógica, resguardos, medidas y participación de la comunidad","Presentación general · Parte 2 de 3 · Capítulos 6 a 10"],"speech":"Continuamos con la segunda parte de la presentación general del reglamento. Revisaremos los capítulos 6 al 10, que abordan seguridad, gestión pedagógica, medidas y convivencia. El recorrido permitirá reconocer los resguardos previstos en el documento, las responsabilidades de los equipos y las instancias de participación. Al finalizar, trabajaremos una actividad para distinguir distintas rutas de actuación.","audio":"audio/B01.mp3","source":"REGLAMENTO CEIA 2026–2027","code":"B01"},{"tag":"PARTE 2 DE 3   /   SEGURIDAD Y CONVIVENCIA","title":"6.1 y 6.2 · Seguridad y derechos","body":["6.1 Plan Integral de Seguridad Escolar","El comité y su coordinación elaboran el PISE. El Consejo Escolar lo aprueba y el establecimiento lo actualiza al menos una vez por año escolar.","6.2 Vulneración de derechos","Contempla prevención, capacitación y un protocolo para actuar cuando se detecta una situación que afecta derechos de estudiantes."],"speech":"El punto 6.1 aborda el Plan Integral de Seguridad Escolar. Según el reglamento, el comité y su coordinación lo elaboran, el Consejo Escolar lo aprueba y el establecimiento lo actualiza al menos una vez por año escolar. El punto 6.2 contempla prevención, capacitación y un protocolo de actuación frente a situaciones que afectan los derechos de los estudiantes.","audio":"audio/B02.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 62–63","code":"B02"},{"tag":"PARTE 2 DE 3   /   SEGURIDAD Y CONVIVENCIA","title":"6.3 y 6.4 · Prevención y actuación","body":["6.3 Agresiones sexuales","Prevé acciones de prevención e información y remite al protocolo frente a hechos que afectan la integridad de estudiantes.","6.4 Drogas y alcohol","Contempla acciones preventivas para estudiantes y funcionarios y remite al protocolo para abordar las situaciones que se detecten."],"speech":"Los puntos 6.3 y 6.4 presentan acciones de prevención y orientaciones de actuación. El primero aborda agresiones sexuales y hechos que afectan la integridad de los estudiantes. El segundo trata situaciones relacionadas con drogas y alcohol. Ambos apartados remiten a protocolos específicos. Esta presentación permite ubicar esos instrumentos, cuyos pasos y responsables deben consultarse en el documento completo.","audio":"audio/B03.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 63–65","code":"B03"},{"tag":"PARTE 2 DE 3   /   SEGURIDAD Y CONVIVENCIA","title":"6.5 y 6.6 · Accidentes e higiene","body":["6.5 Accidentes escolares","El capítulo remite al protocolo del Anexo 05, que contiene actuación y declaración del accidente.","6.6 Higiene","Define responsabilidades y registros de aseo, desinfección, ventilación y control de plagas. Incluye procedimientos ante enfermedades infectocontagiosas y sobre vacunación."],"speech":"El punto 6.5 remite al protocolo de accidentes escolares del anexo 5, que incluye la actuación y la declaración del accidente. El punto 6.6 define responsabilidades y registros de aseo, desinfección, ventilación y control de plagas. También aborda enfermedades infectocontagiosas y vacunación. Estos contenidos vinculan el cuidado de las personas con la organización y el mantenimiento de los espacios.","audio":"audio/B04.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 65–77","code":"B04"},{"tag":"PARTE 2 DE 3   /   SEGURIDAD Y CONVIVENCIA","title":"7.1 y 7.2 · Gestión pedagógica","body":["7.1 Regulaciones técnico-pedagógicas","El apartado remite al Reglamento de Evaluación del establecimiento.","7.2 Evaluación y promoción","Para revisar los criterios y procedimientos que rigen la evaluación y la promoción, el capítulo remite al mismo instrumento."],"speech":"Los puntos 7.1 y 7.2 se refieren a las regulaciones técnico pedagógicas, la evaluación y la promoción. En ambos casos, el capítulo remite al Reglamento de Evaluación del establecimiento. Para conocer criterios y procedimientos concretos, corresponde consultar ese instrumento. Así podemos distinguir qué materias desarrolla directamente el reglamento interno y cuáles se encuentran reguladas en documentos complementarios.","audio":"audio/B05.mp3","source":"Reglamento CEIA 2026–2027  /  p. 77","code":"B05"},{"tag":"PARTE 2 DE 3   /   SEGURIDAD Y CONVIVENCIA","title":"7.3 · Embarazo, maternidad y paternidad","body":["Continuidad de estudios","El protocolo orienta el acompañamiento y el apoyo para mantener la trayectoria educativa.","Asistencia y permisos","Contempla flexibilidad justificada y registro de asistencia, permisos e ingresos o retiros, según la situación."],"speech":"El punto 7.3 aborda el acompañamiento ante embarazo, maternidad y paternidad. Su propósito es apoyar la continuidad de la trayectoria educativa. El apartado contempla flexibilidad justificada y registros de asistencia, permisos, ingresos y retiros según cada situación. La revisión del protocolo permite reconocer los apoyos previstos y la coordinación necesaria para acompañar al estudiante.","audio":"audio/B06.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 77–81","code":"B06"},{"tag":"PARTE 2 DE 3   /   SEGURIDAD Y CONVIVENCIA","title":"7.4 · Salidas pedagógicas y giras","body":["Planificación","La salida se vincula a objetivos de aprendizaje y requiere organizar responsables, documentación y condiciones de seguridad.","Menores de edad","Se requiere autorización escrita. El CEIA debe asegurar la continuidad educativa de quienes no puedan participar."],"speech":"Las salidas pedagógicas se vinculan con objetivos de aprendizaje y requieren planificar responsables, documentación y condiciones de seguridad. Para estudiantes menores de edad se contempla autorización escrita. El establecimiento debe asegurar la continuidad educativa de quienes no puedan participar. Al organizar una actividad fuera del centro, debemos consultar tanto este apartado como el protocolo correspondiente.","audio":"audio/B07.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 81–82","code":"B07"},{"tag":"PARTE 2 DE 3   /   SEGURIDAD Y CONVIVENCIA","title":"8.1 · Conductas esperadas y faltas","body":["Conductas esperadas","El capítulo explicita acuerdos relacionados con el aula, el trato, el cuidado de recursos y la participación en las actividades.","Tablas por estamento","Clasifican faltas y respuestas para estudiantes, funcionarios y padres, madres, apoderados o tutores. Se debe consultar la fila aplicable a cada caso."],"speech":"El capítulo 8 presenta conductas esperadas relacionadas con el aula, el trato, el cuidado de recursos y la participación. También incluye tablas de faltas y respuestas diferenciadas para estudiantes, funcionarios y adultos responsables. Para revisar una situación, corresponde identificar el estamento y consultar la fila aplicable. Las tablas permiten relacionar la conducta descrita con las respuestas previstas en el reglamento.","audio":"audio/B08.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 83–108","code":"B08"},{"tag":"PARTE 2 DE 3   /   SEGURIDAD Y CONVIVENCIA","title":"8.2 · Medidas frente a las faltas","body":["Apoyos formativos","El texto contempla reflexión, diálogo, reparación y acompañamiento para mejorar la convivencia.","Otras medidas","Presenta medidas administrativas, protectoras y disciplinarias. Su elección depende del contexto, el estamento y las características de la conducta."],"speech":"El punto 8.2 contempla apoyos formativos, como reflexión, diálogo, reparación y acompañamiento. También presenta medidas administrativas, protectoras y disciplinarias. La elección depende del contexto, del estamento y de las características de la conducta. Al revisar una situación concreta, debemos consultar la descripción de cada medida y el procedimiento que corresponde aplicar.","audio":"audio/B09.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 108–112","code":"B09"},{"tag":"PARTE 2 DE 3   /   SEGURIDAD Y CONVIVENCIA","title":"8.3 · Debido proceso","body":["Indagación","Registrar hechos, reunir antecedentes, escuchar a las partes y resguardar la dignidad y la privacidad.","Decisión y revisión","Documentar fundamentos, notificar conforme al procedimiento y aplicar los mecanismos de reconsideración que correspondan.","Seguimiento y protección","Registrar acuerdos, citaciones y apoyos. El capítulo contempla la solicitud de medidas de protección ante vulneración de derechos de menores."],"speech":"El debido proceso comprende registrar los hechos, reunir antecedentes y escuchar a las partes, resguardando su dignidad y privacidad. Las decisiones deben contar con fundamentos documentados y notificarse conforme al procedimiento. El capítulo contempla mecanismos de reconsideración y el registro de acuerdos, citaciones y apoyos. También aborda medidas de protección ante vulneraciones de derechos de menores de edad.","audio":"audio/B10.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 112–119","code":"B10"},{"tag":"PARTE 2 DE 3   /   SEGURIDAD Y CONVIVENCIA","title":"8.4 · Reconocimientos","body":["Funcionarios","El reglamento considera el reconocimiento anual por el desempeño en la labor.","Estudiantes","El establecimiento contempla reconocimientos por asistencia y rendimiento académico anual."],"speech":"El reglamento incorpora reconocimientos para distintos integrantes de la comunidad. Para los funcionarios considera el desempeño anual de su labor. Para los estudiantes contempla la asistencia y el rendimiento académico anual. Este apartado complementa la revisión de conductas y medidas, mostrando cómo el establecimiento reconoce aspectos positivos de la participación y del trabajo educativo.","audio":"audio/B11.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 119–120","code":"B11"},{"tag":"PARTE 2 DE 3   /   SEGURIDAD Y CONVIVENCIA","title":"9 · Enfoque de convivencia educativa","body":["Convivencia en EPJA","El CEIA promueve el buen trato, la participación, el bienestar y relaciones respetuosas entre personas con distintas experiencias y trayectorias.","Articulación institucional","Las acciones se coordinan con el Plan de Gestión de Convivencia, el PEI y otros instrumentos institucionales."],"speech":"La convivencia en educación de jóvenes y adultos considera personas con distintas experiencias y trayectorias. El centro promueve el buen trato, la participación, el bienestar y las relaciones respetuosas. Las acciones se articulan con el Plan de Gestión de Convivencia, el Proyecto Educativo Institucional y otros instrumentos. Esta coordinación permite relacionar la convivencia con los propósitos educativos del establecimiento.","audio":"audio/B12.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 120–122","code":"B12"},{"tag":"PARTE 2 DE 3   /   SEGURIDAD Y CONVIVENCIA","title":"9.1 · Consejo Escolar","body":["Composición","Participan Dirección y representantes de los estamentos señalados en el reglamento. El capítulo explica cómo integrar a otros miembros.","Funcionamiento","El apartado describe las funciones, las sesiones y el alcance de sus facultades."],"speech":"El Consejo Escolar reúne a la Dirección y a representantes de los estamentos señalados en el reglamento. El apartado explica su composición, la incorporación de otros miembros y su funcionamiento. También describe las funciones, las sesiones y el alcance de sus facultades. Al revisar este punto, interesa reconocer cómo participa cada estamento y cómo se canalizan sus aportes.","audio":"audio/B13.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 122–124","code":"B13"},{"tag":"PARTE 2 DE 3   /   SEGURIDAD Y CONVIVENCIA","title":"9.2 y 9.3 · Equipo y plan de convivencia","body":["9.2 Encargada de Convivencia","Coordina acciones, orienta y capacita, apoya entrevistas e indagaciones y realiza seguimiento. La dupla ofrece apoyo psicológico y social y coordina con redes.","9.3 Plan de Gestión","El punto remite al anexo. El propio reglamento asigna a la encargada la elaboración e implementación del plan con aportes de la comunidad y coherencia con el PEI y PME."],"speech":"La encargada de Convivencia coordina acciones, orienta y capacita, apoya entrevistas e indagaciones y realiza seguimiento. La dupla psicosocial ofrece apoyo psicológico y social, y coordina con redes. El reglamento asigna a la encargada la elaboración e implementación del Plan de Gestión, con aportes de la comunidad y coherencia con el proyecto educativo y el Plan de Mejoramiento Educativo.","audio":"audio/B14.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 125–126","code":"B14"},{"tag":"PARTE 2 DE 3   /   SEGURIDAD Y CONVIVENCIA","title":"9.4 · Prevención, reparación y medidas","body":["Prevención","Difusión de normas y acciones de sensibilización, monitoreo y autorregulación.","Reparación y medidas","Promueve reconocer y reparar el daño. También describe medidas aplicables al personal y la solicitud de investigación al sostenedor en los casos previstos."],"speech":"El punto 9.4 considera la difusión de normas y acciones de sensibilización, monitoreo y autorregulación. En materia de reparación, promueve reconocer el daño y desarrollar acciones para repararlo. También describe medidas aplicables al personal y la solicitud de investigación al sostenedor en los casos previstos. Cada actuación requiere considerar las responsabilidades y atribuciones establecidas en el documento.","audio":"audio/B15.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 126–129","code":"B15"},{"tag":"PARTE 2 DE 3   /   SEGURIDAD Y CONVIVENCIA","title":"9.5 · Gestión colaborativa de conflictos","body":["Herramientas","Negociación, mediación y conciliación. Se requiere participación voluntaria y equilibrio entre las partes.","Límites y reclamos","Las situaciones gravísimas siguen la vía correspondiente. El apartado regula recepción de reclamos, resguardo, plazos y derivaciones."],"speech":"La gestión colaborativa contempla negociación, mediación y conciliación. El reglamento requiere participación voluntaria y equilibrio entre las partes. Las situaciones gravísimas siguen la vía correspondiente. El apartado también regula la recepción de reclamos, los resguardos, los plazos y las derivaciones. Para elegir una herramienta, debemos revisar si existen las condiciones que exige el procedimiento.","audio":"audio/B16.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 129–133","code":"B16"},{"tag":"PARTE 2 DE 3   /   SEGURIDAD Y CONVIVENCIA","title":"9.6 y 9.7 · Prevención y participación","body":["9.6 Maltrato, acoso y violencia","Contempla acciones preventivas a cargo de Convivencia. El protocolo específico figura en el Anexo 03 de la primera serie.","9.7 Participación","Regula instancias de participación y coordinación, entre ellas el Consejo de Profesores y el Centro de Estudiantes."],"speech":"El punto 9.6 contempla acciones preventivas frente a maltrato, acoso y violencia, a cargo de Convivencia. El protocolo específico se encuentra en el anexo 3 de la primera serie. El punto 9.7 regula instancias de participación y coordinación, entre ellas el Consejo de Profesores y el Centro de Estudiantes. Estos espacios forman parte de la organización de la comunidad educativa.","audio":"audio/B17.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 133–136","code":"B17"},{"tag":"PARTE 2 DE 3   /   SEGURIDAD Y CONVIVENCIA","title":"10 · Actualización y difusión","body":["Revisión","El CEIA revisa y actualiza el reglamento al menos una vez al año, consulta al Consejo Escolar y registra el proceso de difusión.","Acceso","El texto indica dónde consultar ejemplares y cómo se informa de las modificaciones a la comunidad."],"speech":"El capítulo 10 aborda la revisión y difusión del reglamento. El texto establece una actualización al menos anual, con consulta al Consejo Escolar y registro del proceso de difusión. También indica dónde consultar ejemplares y cómo informar las modificaciones. Para que el documento oriente el trabajo cotidiano, la comunidad necesita conocerlo y poder acceder a su versión correspondiente.","audio":"audio/B18.mp3","source":"Reglamento CEIA 2026–2027  /  p. 136","code":"B18"},{"tag":"TRABAJO EN GRUPO","title":"¿Qué corresponde activar?","body":["Caso ficticio","Dos estudiantes discrepan en un trabajo de taller. En otro curso, una persona denuncia hostigamiento reiterado.","Conversación","¿Cuándo se cumplen las condiciones para una gestión colaborativa? ¿En cuál de los casos corresponde consultar el protocolo y adoptar resguardos?"],"speech":"Detengámonos en dos situaciones ficticias. En un taller, dos estudiantes discrepan durante un trabajo. En otro curso, una persona denuncia hostigamiento reiterado. Revisa en cuál se cumplen las condiciones para una gestión colaborativa y en cuál corresponde consultar un protocolo y adoptar resguardos. Fundamenta tu respuesta en los apartados señalados. Puedes pausar la presentación y registrar tus conclusiones antes de continuar.","audio":"audio/B19.mp3","source":"Reglamento CEIA 2026–2027  /  Actividad · pp. 109–133","code":"B19"},{"tag":"EDUCACIÓN DE PERSONAS JÓVENES Y ADULTAS","title":"Protocolos y anexos","body":["Dónde encontrar la ruta de actuación y los formularios del CEIA","Presentación general · Parte 3 de 3 · Páginas 137 a 235"],"speech":"Comenzamos la tercera y última parte de la presentación general: protocolos y anexos. Este bloque permite ubicar las rutas de actuación y los formularios del reglamento. Su propósito es que sepamos dónde consultar cuando se presenta una situación concreta. Revisaremos los títulos y las referencias de las secciones, y cerraremos con una actividad de búsqueda y aplicación.","audio":"audio/C01.mp3","source":"REGLAMENTO CEIA 2026–2027","code":"C01"},{"tag":"PARTE 3 DE 3   /   PROTOCOLOS Y ANEXOS","title":"Cómo encontrar el protocolo","body":["Primera serie","La sección «Anexos protocolos reglamento interno» comienza en la página 137 y contiene siete anexos.","Segunda serie","La sección «Procedimientos de actuación» comienza en la página 169 y reinicia la numeración. Busca por título y página."],"speech":"El documento reúne dos series de anexos. La primera comienza en la página 137, bajo la sección de protocolos del reglamento interno, y contiene siete anexos. La segunda comienza en la página 169, como procedimientos de actuación, y reinicia la numeración. Por eso, al buscar una ruta, conviene identificar el título y la página además del número de anexo.","audio":"audio/C02.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 7–9 y 137–235","code":"C02"},{"tag":"PARTE 3 DE 3   /   PROTOCOLOS Y ANEXOS","title":"Anexos 01 a 03 · Protección y buen trato","body":["01 Vulneración de derechos · p. 137","Orienta la actuación y el resguardo ante amenazas o vulneraciones de derechos.","02 Agresiones sexuales · p. 139","Establece una ruta institucional ante agresiones o hechos de connotación sexual que afectan a estudiantes.","03 Maltrato, acoso o violencia · p. 142","Organiza la recepción de antecedentes, el resguardo, el procedimiento y el seguimiento."],"speech":"Los tres primeros anexos se relacionan con protección y buen trato. El de vulneración de derechos comienza en la página 137. El de agresiones sexuales y hechos de connotación sexual comienza en la 139. El de maltrato, acoso o violencia comienza en la 142. Estas referencias permiten consultar la recepción de antecedentes, los resguardos y las actuaciones que describe cada protocolo.","audio":"audio/C03.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 137, 139 y 142","code":"C03"},{"tag":"PARTE 3 DE 3   /   PROTOCOLOS Y ANEXOS","title":"Anexos 04 y 05 · Alcohol, drogas y accidentes","body":["04 Drogas y alcohol · p. 154","Ordena la actuación ante situaciones relacionadas con estas sustancias en el establecimiento.","05 Accidentes escolares · p. 158","Describe atención, aviso, derivación y registro. Incluye la declaración de accidente escolar."],"speech":"El anexo 4, sobre drogas y alcohol, comienza en la página 154 y organiza la actuación ante situaciones relacionadas con estas sustancias. El anexo 5, de accidentes escolares, comienza en la página 158. Describe atención, aviso, derivación y registro, e incluye la declaración de accidente escolar. Para actuar, corresponde revisar los pasos completos del protocolo aplicable.","audio":"audio/C04.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 154 y 158","code":"C04"},{"tag":"PARTE 3 DE 3   /   PROTOCOLOS Y ANEXOS","title":"Anexos 06 y 07 · Salidas y desregulación","body":["06 Salidas pedagógicas y giras","Amplía las orientaciones para organizar actividades fuera del establecimiento.","07 Desregulación emocional y conductual","Contiene orientaciones de respuesta y atención ante episodios de desregulación."],"speech":"Los anexos 6 y 7 abordan dos materias distintas. El de salidas pedagógicas y giras amplía las orientaciones para organizar actividades fuera del establecimiento. El de desregulación emocional y conductual contiene orientaciones de respuesta y atención ante estos episodios. Al consultar los anexos, debemos identificar cuál corresponde a la situación y revisar sus indicaciones específicas.","audio":"audio/C05.mp3","source":"Reglamento CEIA 2026–2027  /  p. 163","code":"C05"},{"tag":"PARTE 3 DE 3   /   PROTOCOLOS Y ANEXOS","title":"Procedimientos 01 y 02 · Seguridad inmediata","body":["01 Porte de armas · p. 169","Consultar la ruta de aviso, protección y coordinación institucional establecida en el documento.","02 Fuga o cimarra · p. 171","Consultar el procedimiento cuando se detecta la salida o ausencia no autorizada del establecimiento."],"speech":"La segunda serie comienza con procedimientos de seguridad inmediata. El de porte de armas se encuentra desde la página 169 y contempla aviso, protección y coordinación institucional. El de fuga o cimarra comienza en la 171 y aborda salidas o ausencias no autorizadas. Estas láminas sirven para localizar la ruta de actuación establecida en el documento.","audio":"audio/C06.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 169 y 171","code":"C06"},{"tag":"PARTE 3 DE 3   /   PROTOCOLOS Y ANEXOS","title":"Procedimientos 03 a 05 · Riesgo y crisis","body":["03 Riesgo suicida · p. 172","Orienta la activación del apoyo y la coordinación ante señales de riesgo.","04 Intento suicida y posvención · p. 174","Incluye acciones posteriores y un apartado de respuesta institucional de 24 horas desde la p. 176.","05 Intervención en crisis · p. 178","Ordena la respuesta institucional y el acompañamiento durante una crisis."],"speech":"Los procedimientos 3 al 5 abordan riesgo suicida, intento suicida, posvención e intervención en crisis. Se ubican entre las páginas 172 y 178. El documento incluye un apartado de respuesta institucional de 24 horas desde la página 176. Frente a estas materias, debemos consultar directamente las indicaciones, los apoyos y la coordinación que establece el procedimiento correspondiente.","audio":"audio/C07.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 172–178","code":"C07"},{"tag":"PARTE 3 DE 3   /   PROTOCOLOS Y ANEXOS","title":"Procedimientos 06 a 08 · Inclusión y apoyo","body":["06 Estudiantes migrantes · p. 181","Consultar las orientaciones para su incorporación y atención.","07 Estudiantes transgénero · p. 181","Consultar el procedimiento de reconocimiento y resguardo de derechos en el contexto educativo.","08 Dupla psicosocial · p. 184","Orienta la atención y derivación a los profesionales de apoyo."],"speech":"Los procedimientos 6 al 8 reúnen orientaciones sobre estudiantes migrantes, estudiantes transgénero y atención de la dupla psicosocial. Los dos primeros comienzan en la página 181 y abordan incorporación, reconocimiento y resguardo de derechos. El de la dupla comienza en la 184 y orienta la atención y derivación a profesionales de apoyo.","audio":"audio/C08.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 181 y 184","code":"C08"},{"tag":"PARTE 3 DE 3   /   PROTOCOLOS Y ANEXOS","title":"Procedimientos 09 a 11 · Registro y salud","body":["09 Hurtos y siniestros · p. 185","Establece el procedimiento institucional ante ocurrencia o aviso de estos hechos.","10 Licencias y certificados · p. 186","Indica cómo recepcionar y registrar documentación de salud.","11 Medicamentos · p. 187","Consultar el procedimiento y los respaldos para administrar medicamentos a estudiantes."],"speech":"Los procedimientos 9 al 11 se encuentran entre las páginas 185 y 187. Abordan hurtos y siniestros, recepción de licencias y certificados, y administración de medicamentos a estudiantes. Para cada materia, corresponde consultar la ruta institucional y los respaldos que exige el documento. La presentación facilita su ubicación sin reemplazar la revisión del procedimiento completo.","audio":"audio/C09.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 185–187","code":"C09"},{"tag":"PARTE 3 DE 3   /   PROTOCOLOS Y ANEXOS","title":"Procedimiento 12 · Trayectoria y revinculación","body":["12.1 Inasistencias · p. 191","Describe la actuación ante ausencias para dar seguimiento a la trayectoria educativa.","12.2 Baja de matrícula · p. 192","Establece el procedimiento institucional para una eventual baja del registro.","12.3 Declaración jurada · p. 194","Contiene el formulario asociado a la baja de matrícula."],"speech":"El procedimiento 12 reúne apartados relacionados con la trayectoria educativa. Las inasistencias se abordan desde la página 191. La eventual baja de matrícula se desarrolla desde la 192, y la declaración jurada asociada se encuentra en la 194. Estas secciones permiten ubicar las actuaciones de seguimiento y la documentación correspondiente a cada etapa.","audio":"audio/C10.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 191–194","code":"C10"},{"tag":"PARTE 3 DE 3   /   PROTOCOLOS Y ANEXOS","title":"Procedimientos 13 a 15 · Género y tecnología","body":["13 Violencia de género · p. 195","Describe la actuación institucional frente a situaciones de violencia de género.","14 Dispositivos móviles · p. 196","Contiene restricciones, condiciones y excepciones de uso en el contexto educativo.","15 Cámaras de televigilancia · p. 204","Regula el uso institucional de cámaras y el tratamiento de las grabaciones."],"speech":"Los procedimientos 13 al 15 abordan violencia de género, dispositivos móviles y cámaras de televigilancia. Se encuentran en las páginas 195, 196 y 204, respectivamente. El primero describe la actuación institucional. Los otros regulan condiciones y excepciones de uso de dispositivos, junto con el uso de cámaras y el tratamiento de grabaciones. Para resolver dudas, debemos revisar las disposiciones completas.","audio":"audio/C11.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 195, 196 y 204","code":"C11"},{"tag":"PARTE 3 DE 3   /   PROTOCOLOS Y ANEXOS","title":"Procedimientos 16 y 17 · Medidas y reclamos","body":["16.1 Expulsión y cancelación · p. 209","Detalla la ruta aplicable a estas medidas, incluidos los pasos del procedimiento.","16.2 Aula Segura · p. 212","Presenta el procedimiento especial contemplado en el documento.","17 Canales de atención · p. 215","Ubica los canales para denuncias, reclamos, sugerencias, propuestas y otros requerimientos."],"speech":"El procedimiento 16 aborda expulsión y cancelación de matrícula desde la página 209, y el procedimiento especial de Aula Segura desde la 212. El procedimiento 17, desde la página 215, reúne canales de atención para denuncias, reclamos, sugerencias y otros requerimientos. En estas materias, corresponde consultar la ruta íntegra, sus pasos y las atribuciones que establece el documento.","audio":"audio/C12.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 209, 212 y 215","code":"C12"},{"tag":"PARTE 3 DE 3   /   PROTOCOLOS Y ANEXOS","title":"Procedimientos 18 a 21 · Citación y constancia","body":["18 Seguridad, orden y respeto · p. 220","Contiene el procedimiento institucional y un certificado de asistencia y justificativo laboral en la p. 225.","19 y 20 Actas · pp. 226–227","Formularios para registrar coordinaciones y entrevistas.","21 Citación y visita · p. 228","Formatos de citación al adulto responsable y aviso de visita domiciliaria."],"speech":"Los procedimientos 18 al 21 incluyen seguridad, orden y respeto, junto con formularios de respaldo. Encontramos un certificado de asistencia y justificativo laboral en la página 225. Las actas de coordinación y entrevista se ubican en las páginas 226 y 227. Los formatos de citación al adulto responsable y aviso de visita domiciliaria comienzan en la página 228.","audio":"audio/C13.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 220, 225–228","code":"C13"},{"tag":"PARTE 3 DE 3   /   PROTOCOLOS Y ANEXOS","title":"Procedimientos 22 y 23 · Matrícula y condicionalidad","body":["22 Expulsión y cancelación · p. 229","Apartado adicional de consulta sobre el procedimiento, junto con el Anexo 16.","23 Condicionalidad · p. 230","Describe causales, activación, seguimiento y revisión. El formato de acta figura en la p. 234."],"speech":"El procedimiento 22 contiene un apartado adicional sobre expulsión y cancelación de matrícula, en la página 229, que debe consultarse junto con el anexo 16. El procedimiento 23 desarrolla la condicionalidad desde la página 230, con causales, activación, seguimiento y revisión. Su formato de acta se encuentra en la página 234. Las referencias permiten ubicar los apartados relacionados antes de actuar.","audio":"audio/C14.mp3","source":"Reglamento CEIA 2026–2027  /  pp. 229–234","code":"C14"},{"tag":"TRABAJO EN GRUPO","title":"¿Qué documento respalda la actuación?","body":["Caso ficticio","Un estudiante acumula inasistencias. En la entrevista de seguimiento, comenta que ha recibido mensajes hostiles de alguien del curso.","Conversación","¿Dónde se consulta la ruta de asistencia? ¿Qué protocolo corresponde revisar por los mensajes? ¿En qué formulario se deja constancia de la entrevista?"],"speech":"Cerramos la presentación general con una situación ficticia. Un estudiante acumula inasistencias y, durante la entrevista de seguimiento, comenta que recibe mensajes hostiles de alguien del curso. Identifica dónde consultar la ruta de asistencia, qué protocolo revisar por los mensajes y en qué formulario dejar constancia de la entrevista. Pausa la presentación para responder y registrar tus dudas. Estas conclusiones servirán de base para profundizar en los temas específicos de la segunda jornada.","audio":"audio/C15.mp3","source":"Reglamento CEIA 2026–2027  /  Actividad · pp. 142, 191 y 227","code":"C15"}];const $=id=>document.getElementById(id);const partStarts={A:0,B:16,C:35};const requestedPart=(new URLSearchParams(location.search).get('parte')||'A').toUpperCase();let i=partStarts[requestedPart]??0;const audio=$('audio');function show(){const s=slides[i];for(const p of ['A','B','C'])$('part'+p).setAttribute('aria-pressed',String(s.code.startsWith(p)));$('tag').textContent=s.tag;$('title').textContent=s.title;$('count').textContent=(i+1)+' / '+slides.length;$('fill').style.width=(i+1)/slides.length*100+'%';$('speech').textContent=s.speech;$('source').textContent=s.source;$('body').className=s.body.length>12?'dense':'';$('body').replaceChildren(...s.body.map(x=>{let el=document.createElement('div');el.className='item';el.textContent=x;return el}));$('jump').value=i;$('prev').disabled=!i;$('next').disabled=i===slides.length-1;audio.src=s.audio;$('status').textContent='Locución profesional · Silvana · RICE, partes A, B y C';}function play(){audio.play().catch(()=>{$('status').textContent='No se encontró el audio de esta diapositiva. Comprueba la carpeta audio.'})}function go(n){const live=!audio.paused;i=Math.max(0,Math.min(slides.length-1,n));show();if(live)play()}audio.addEventListener('ended',()=>{if($('auto').checked&&i<slides.length-1){i++;show();play()}else $('status').textContent=i===slides.length-1?'Presentación finalizada.':'Narración finalizada.'});audio.addEventListener('error',()=>{$('status').textContent='Archivo de audio no disponible.'});audio.onplay=()=>{$('play').textContent='Pausar'};audio.onpause=()=>{$('play').textContent='Reproducir'};$('play').onclick=()=>audio.paused?play():audio.pause();$('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);$('jump').replaceChildren(...slides.map((s,j)=>new Option(s.code+' · '+s.title,j)));$('jump').onchange=()=>go(Number($('jump').value));$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();for(const p of ['A','B','C'])$('part'+p).onclick=()=>{const url=new URL(location.href);url.searchParams.set('parte',p);history.replaceState(null,'',url);go(partStarts[p])};show();</script></body></html>
