<!doctype html><html lang="es-CL"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PEI 2027–2030 | Taller asincrónico</title><style>*{box-sizing:border-box}body{margin:0;background:#e7eff0;color:#14333e;font:17px Arial,sans-serif}main{max-width:1300px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;font-weight:bold;color:#185e64;gap:15px}.slide{margin-top:18px;background:white;border-top:10px solid #187b76;border-radius:12px;padding:clamp(20px,4vw,55px);min-height:480px}h1{font-size:clamp(24px,3.5vw,48px);margin:12px 0 25px}.tag{color:#197970;font-weight:bold;font-size:14px;letter-spacing:1px}#body{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{padding:10px 14px;background:#eef6f5;border-left:4px solid #79aea9;line-height:1.4}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}button,select{font:inherit;padding:10px;border:1px solid #b4c9cd;background:white;border-radius:7px;color:#153b45}button.primary{background:#176f6e;color:white;font-weight:bold}audio{width:100%;margin-top:16px}details{margin-top:15px;background:white;padding:16px;border-radius:8px}summary{cursor:pointer}#status{font-size:14px;color:#426168}.dense{font-size:14px}#bar{height:6px;background:#c3d7d8;border-radius:4px;margin-top:15px}#fill{height:100%;background:#187b76;border-radius:4px}select{max-width:320px}@media(max-width:650px){main{padding:12px}#body{grid-template-columns:1fr}.slide{min-height:300px}}</style><body><main><header><span>CEIA JUANITA ZÚÑIGA FUENTES · PARRAL</span><span id="count"></span></header><section class="slide"><div class="tag" id="tag"></div><h1 id="title"></h1><div id="body"></div></section><div id="bar"><div id="fill"></div></div><audio id="audio" controls preload="metadata"></audio><div class="controls"><button id="prev">← Anterior</button><button class="primary" id="play">Reproducir</button><button id="next">Siguiente →</button><button id="full">Pantalla completa</button><label><input id="auto" type="checkbox" checked> Avance automático</label><select id="jump"></select></div><p id="status" role="status"></p><details><summary>Transcripción de la narración</summary><p id="speech"></p></details></main><script>const slides=[{"tag":"CEIA JUANITA ZÚÑIGA FUENTES · PARRAL","title":"Proyecto Educativo Institucional 2027–2030","body":["Principales novedades respecto del PEI 2022–2027","Jornada de apropiación"],"speech":"Bienvenidas y bienvenidos a esta jornada de apropiación del Proyecto Educativo Institucional del CEIA Juanita Zúñiga Fuentes, de Parral. Revisaremos el periodo dos mil veintisiete a dos mil treinta y las principales novedades respecto del proyecto anterior. Nuestro propósito es comprender cómo esta actualización orienta el trabajo de toda la comunidad educativa."},{"tag":"EL DOCUMENTO","title":"Estructura del Proyecto Educativo","body":["Identidad y contexto","Historia y diagnóstico del CEIA","Ideario, misión, visión y sellos","Perfiles de la comunidad educativa","Gestión y evaluación","Gestión, formación TP y convivencia","Participación y redes del territorio","Seguimiento, actualización y anexos"],"speech":"El documento se organiza en dos grandes áreas. La primera reúne la identidad institucional, nuestra historia, el contexto y los perfiles de quienes forman parte de la comunidad. La segunda aborda la gestión, la formación técnica, la convivencia, las redes y la evaluación. Este recorrido nos permite conectar lo que somos con las acciones que queremos desarrollar."},{"tag":"EL DOCUMENTO","title":"Importancia del PEI para el CEIA","body":["Una orientación común","Define la identidad y el propósito educativo","Orienta decisiones pedagógicas y formativas","Expresa el compromiso con jóvenes y adultos","Un referente para decidir","Permite priorizar apoyos y recursos","Da coherencia al trabajo de los equipos","Entrega criterios para evaluar los avances"],"speech":"El proyecto educativo es el marco que da sentido a nuestras decisiones. Define nuestro propósito, orienta la enseñanza y expresa el compromiso con las personas jóvenes y adultas. En la práctica, permite decidir qué apoyos priorizar y cómo evaluar nuestros avances."},{"tag":"EL DOCUMENTO","title":"Relación con los instrumentos de gestión","body":["PEI y PME","El PEI define identidad y objetivos","El PME concreta acciones de mejora","La planificación anual asigna responsables","Reglamentos y planes","El RICE orienta la convivencia","El Reglamento de Evaluación regula ese proceso","Los planes institucionales desarrollan áreas específicas"],"speech":"El proyecto educativo se concreta a través del Plan de Mejoramiento Educativo, la planificación anual, el reglamento interno y los planes institucionales. La actualización refuerza su articulación y las responsabilidades de cada equipo, favoreciendo un trabajo coherente."},{"tag":"VISTA COMPARATIVA","title":"Alcance de la actualización","body":["PEI 2022–2027","Identidad e historia institucional","Perfil del estudiante y valores","Autoevaluación y metas en cuatro áreas","Oferta educativa","PEI 2027–2030","Amplía el contexto y el diagnóstico","Desarrolla perfiles y responsabilidades","Profundiza apoyos, TP y participación","Agrega procedimientos de seguimiento"],"speech":"Al comparar ambos documentos, encontramos una continuidad importante en la identidad. La actualización amplía el diagnóstico, desarrolla perfiles, profundiza el acompañamiento y establece procedimientos de seguimiento. Así, la propuesta educativa se transforma en compromisos más claros."},{"tag":"CONTINUIDADES","title":"La identidad institucional se mantiene","body":["Continuidad de nuestro propósito educativo","Misión y visión","Mantienen su formulación central","Integración social y base ética","Diversidad, inclusión y ciudadanía","Sellos y oferta","Formación para la vida","Formación para el trabajo","Electricidad y Atención de Párvulos"],"speech":"Los principales elementos de nuestra identidad permanecen. La misión, la visión y los sellos de formación para la vida y formación para el trabajo orientan las decisiones institucionales. Las especialidades de Electricidad y Atención de Párvulos siguen siendo parte fundamental del proyecto."},{"tag":"IDENTIDAD · TEXTO VIGENTE","title":"Visión y misión: lo que seguimos declarando","body":["Nuestra Visión","“Centro Educacional Público que aspira a desarrollar un proyecto educativo para jóvenes y adultos, inclusivo y sustentable, que respeta y valora la diversidad, entregándoles una formación que les permita adquirir un espíritu crítico, un sentido democrático y una perspectiva de ciudadano responsable para aportar a la sociedad y acceder a una mejor calidad de vida”.","Nuestra Misión","“Nuestro Centro Educacional Público se orienta a alcanzar la integración social, con énfasis en una base ética que complemente sus capacidades y desarrollo de conocimientos, habilidades, competencias, creatividad, capacidad de logro y de trabajo en equipo, en un ambiente culturalmente diverso, inclusivo que le facilite enfrentar los desafíos de la realidad nacional y del mundo globalizado y el cambio permanente de los diferentes procesos de su propio desarrollo humano”.","Los sellos “Formación para la vida” y “Formación para el trabajo” mantienen su formulación"],"speech":"Nuestra visión aspira a una educación pública inclusiva y sustentable, que valore la diversidad y contribuya al desarrollo de una ciudadanía crítica, democrática y responsable. La misión reafirma la integración social, la formación ética, el desarrollo de conocimientos, habilidades y competencias, y el trabajo colaborativo. Estos principios dan continuidad a nuestra identidad."},{"tag":"CAMBIO INSTITUCIONAL","title":"Sostenedor y articulación territorial","body":["Documento anterior","Identifica a la Municipalidad de Parral","Describe dependencia municipal","Documento actualizado","Identifica al SLEP Los Álamos","Vincula el PEI con los seis objetivos del PEL","Relaciona esa articulación con el PME"],"speech":"El documento actualizado identifica al Servicio Local de Educación Pública Los Álamos como sostenedor. Además, vincula el proyecto educativo con los seis objetivos del Plan Estratégico Local y con el Plan de Mejoramiento Educativo. Esta articulación permite coordinar los desafíos institucionales con la gestión territorial."},{"tag":"ARTICULACIÓN CON EL PEL 2026–2032","title":"Objetivos 1 a 3 del PEL: qué hará el CEIA","body":["1. Aprendizajes y trayectorias","Compromiso: prácticas inclusivas y contextualizadas, evaluación para el aprendizaje, acompañamiento y prevención del abandono.","Énfasis: pensamiento crítico, comunicación, resolución de problemas y competencias TP.","Indicadores: asistencia, permanencia y revinculación, aprobación, continuidad y finalización.","2. Liderazgo y gestión","Compromiso: liderazgo pedagógico, trabajo colaborativo, reflexión sobre las prácticas y desarrollo profesional.","Responsables: Dirección, UTP y Equipo de Gestión articulan con el PME y el PAA.","Indicadores: instancias colaborativas realizadas, participación en desarrollo profesional, acuerdos implementados.","3. Infraestructura y condiciones","Compromiso: priorizar mantención, seguridad, accesibilidad, recursos didácticos y equipamiento de talleres.","Vía: las necesidades se formalizan ante el sostenedor y entran a la planificación anual.","Indicadores: necesidades levantadas, requerimientos gestionados, mejoras ejecutadas y uso del equipamiento."],"speech":"Los primeros tres objetivos del Plan Estratégico Local se relacionan con aprendizajes y trayectorias, liderazgo pedagógico, e infraestructura y condiciones educativas. Para cada uno, el CEIA define compromisos e indicadores que permiten observar avances y gestionar necesidades."},{"tag":"ARTICULACIÓN CON EL PEL 2026–2032","title":"Objetivos 4 a 6 del PEL: qué hará el CEIA","body":["4. Participación y vinculación","Compromiso: fortalecer la participación de estudiantes, docentes y asistentes, la convivencia democrática y la corresponsabilidad.","Enfoque EPJA: las instancias consideran jornadas, responsabilidades laborales y trayectorias personales.","Indicadores: instancias realizadas, participación registrada, propuestas incorporadas o respondidas.","5. Continuidad del servicio","Compromiso: planificación y coordinación de procesos, seguimiento de indicadores y evaluación periódica del PEI y el PME.","Contingencias: medidas coordinadas con el sostenedor, resguardando el derecho a la educación.","Indicadores: monitoreos efectuados, acciones ejecutadas, cumplimiento de metas, contingencias informadas.","6. Articulación territorial","Compromiso: colaborar con educación superior, organismos públicos, centros de práctica y sector productivo.","Para qué: continuidad de estudios, prácticas, titulación, orientación y empleabilidad.","Indicadores: redes y convenios activos, actividades realizadas, estudiantes beneficiados, prácticas gestionadas."],"speech":"Los otros tres objetivos abordan participación, continuidad del servicio y articulación territorial. Se consideran las jornadas y responsabilidades de nuestros estudiantes, el monitoreo de los procesos y las oportunidades de continuidad de estudios, práctica profesional y empleabilidad."},{"tag":"AMPLIACIÓN","title":"Un diagnóstico más contextualizado","body":["Documento anterior","Historia y antecedentes del CEIA","Autoevaluación por áreas de gestión","Reconocimiento de diversidad e inclusión","Documento actualizado","Caracterización social y territorial","Responsabilidades laborales y familiares","Barreras de aprendizaje y permanencia","Necesidades de apoyo socioemocional"],"speech":"El diagnóstico actualizado reconoce la realidad de la educación de personas jóvenes y adultas. Las responsabilidades familiares, laborales y territoriales pueden influir en la asistencia y el aprendizaje. Comprender esta diversidad permite diseñar respuestas pedagógicas y socioemocionales pertinentes."},{"tag":"DIAGNÓSTICO INSTITUCIONAL","title":"A quiénes educamos y qué nos exige","body":["Características de los estudiantes","Trayectorias diversas: interrumpieron sus estudios y buscan retomar y completar la enseñanza media.","Responsabilidades: compatibilizan estudio con trabajo y cuidado de familiares, lo que incide en la asistencia.","Experiencias previas: aportan aprendizajes laborales, familiares y comunitarios integrables a la clase.","Diversidad cultural: distintas edades, orígenes y expectativas en una misma sala.","Necesidades de apoyo: pedagógico y socioemocional para sostener la permanencia.","Desafíos prioritarios","Fortalecer el acceso, la permanencia y la finalización de estudios.","Acompañar a estudiantes con trayectorias interrumpidas.","Desarrollar prácticas pedagógicas inclusivas y contextualizadas a la EPJA.","Favorecer asistencia y participación según trabajo, familia y traslados.","Fortalecer la formación TP y la vinculación con el mundo laboral.","Consolidar redes de colaboración en el territorio."],"speech":"Nuestros estudiantes aportan experiencias de vida, laborales y comunitarias. Muchos buscan retomar y completar sus estudios mientras compatibilizan otras responsabilidades. Por eso, el proyecto prioriza el acceso, la permanencia, el acompañamiento, las redes y la formación técnica."},{"tag":"PROFUNDIZACIÓN","title":"Enfoques educativos más explícitos","body":["Base anterior","Inclusión y diversidad","Formación integral","Aprendizajes para la vida y el trabajo","Desarrollo actualizado","Inclusivo: reducción de barreras","Formativo: autonomía y proyecto de vida","Pedagógico: enseñanza contextualizada","Evaluación diversificada y retroalimentación"],"speech":"El proyecto profundiza tres enfoques complementarios. El inclusivo busca reducir barreras. El formativo promueve la autonomía y el proyecto de vida. El pedagógico propone una enseñanza contextualizada, con estrategias diversificadas y retroalimentación pertinente."},{"tag":"ENFOQUES EN LA PRÁCTICA","title":"Qué significa cada enfoque en la sala de clases","body":["Enfoque inclusivo","Garantizar acceso, participación, aprendizaje y continuidad para todas las personas jóvenes y adultas.","Identificar y reducir las barreras que dificultan asistir, participar y aprender.","Apoyo pedagógico, acompañamiento socioemocional y coordinación con redes.","Cultura de respeto, equidad y no discriminación.","Enfoque formativo","Desarrollo integral: conocimientos, competencias técnicas y habilidades socioemocionales.","Reconocer los aprendizajes adquiridos a lo largo de la vida.","Promover autonomía, autoestima, perseverancia y decisiones informadas.","Convivencia: respeto mutuo, diálogo y resolución pacífica de conflictos.","Enfoque pedagógico","Enseñanza contextualizada y flexible, centrada en el aprendizaje adulto.","Vincular los contenidos con situaciones reales y significativas.","Estrategias diversificadas y evaluación que retroalimenta el proceso.","Trabajo colaborativo entre docentes, UTP, PIE y profesionales de apoyo."],"speech":"En la sala de clases, estos enfoques se traducen en actividades conectadas con experiencias reales, reconocimiento de aprendizajes previos y oportunidades diversas de participación. El trabajo colaborativo entre docentes, la unidad técnico pedagógica y los profesionales de apoyo es fundamental."},{"tag":"TRAYECTORIAS EDUCATIVAS","title":"Mayor desarrollo del acompañamiento","body":["El antecedente ya existía","El PEI anterior describe SAT y SAAT","Reconoce la prevención del abandono","Incluye gestión de matrícula y asistencia","La actualización lo profundiza","Acceso, permanencia y finalización","Seguimiento y revinculación","Coordinación pedagógica y psicosocial","Indicadores de trayectoria educativa"],"speech":"El acompañamiento de las trayectorias educativas adquiere mayor desarrollo. El seguimiento de asistencia, la detección de dificultades, la revinculación y la coordinación entre equipos permiten actuar oportunamente para favorecer la permanencia."},{"tag":"AMPLIACIÓN","title":"Perfil del estudiante y formación TP","body":["Documento anterior","Actitudes, conocimientos y habilidades","Pensamiento crítico y ciudadanía","Proyección de estudios y trabajo","Documento actualizado","Refuerza autonomía y proyecto de vida","Explicita competencias digitales y ciudadanas","Desarrolla un perfil específico EPJA–TP","Incorpora seguridad y ética profesional"],"speech":"El perfil del estudiante incorpora una mayor atención a la autonomía, las competencias digitales y ciudadanas y la preparación para la vida laboral. En las especialidades técnicas, también se enfatizan la seguridad y la responsabilidad profesional."},{"tag":"PERFIL DEL ESTUDIANTE","title":"Las seis características que esperamos desarrollar","body":["Disposición y compromiso","Comprometido: participa en las actividades educativas y persevera en el cumplimiento de sus metas.","Responsable: reconoce sus deberes, cumple los acuerdos y asume las consecuencias de sus decisiones.","Respetuoso e inclusivo: valora la diversidad, la dignidad humana y las distintas experiencias de vida.","Autonomía y proyección","Autónomo: desarrolla progresivamente la capacidad de tomar decisiones y resolver problemas.","Colaborativo: trabaja en equipo, escucha otras opiniones y contribuye a una convivencia positiva.","Competencias para la vida y el trabajo: académicas, digitales, ciudadanas y laborales, con autocuidado y vida saludable."],"speech":"Esperamos formar estudiantes comprometidos, responsables, respetuosos, autónomos y colaborativos. A estas características se suma el desarrollo de competencias académicas, digitales, ciudadanas y laborales, siempre desde el autocuidado y la inclusión."},{"tag":"AMPLIACIÓN ORGANIZATIVA","title":"Funciones y responsabilidades definidas","body":["Documento anterior","Nómina del equipo directivo","Perfil centrado en los estudiantes","Responsabilidades generales en la gestión","Documento actualizado","Perfiles docentes y funciones profesionales","Cargos de gestión y coordinación","Profesionales de apoyo y asistentes","Responsabilidad compartida entre equipos"],"speech":"El documento actualizado desarrolla las funciones de docentes, equipos directivos, coordinaciones, profesionales de apoyo y asistentes. Esta claridad facilita la coordinación y fortalece la responsabilidad compartida en los procesos educativos."},{"tag":"IDEARIO INSTITUCIONAL","title":"Los doce principios que orientan nuestro quehacer","body":["Principios 1 al 6","1. Derecho a la educación: acceso, permanencia y continuidad de las trayectorias.","2. Inclusión y diversidad: eliminar barreras para la participación y el aprendizaje.","3. Equidad e igualdad de oportunidades: sin discriminación de ningún tipo.","4. Formación integral: conocimientos, habilidades, actitudes y valores.","5. Respeto y valoración de la diversidad: empatía, tolerancia e interculturalidad.","6. Formación para la vida y el trabajo: competencias personales, sociales y técnicas.","Principios 7 al 12","7. Participación democrática: diálogo, resolución pacífica y ciudadanía activa.","8. Calidad y mejora continua: reflexión, evaluación y mejoramiento permanente.","9. Desarrollo de trayectorias: reincorporación, continuidad y finalización de estudios.","10. Bienestar y convivencia: ambientes seguros, autocuidado y pertenencia.","11. Vinculación con el entorno: redes, instituciones públicas y sector productivo.","12. Sustentabilidad y responsabilidad social: cuidado del medioambiente y de los recursos."],"speech":"Los doce principios institucionales integran el derecho a la educación, la inclusión, la equidad, la formación integral y el respeto a la diversidad. También consideran participación democrática, calidad, trayectorias, bienestar, vinculación territorial y sustentabilidad."},{"tag":"OBJETIVOS ESTRATÉGICOS","title":"Diez objetivos estratégicos institucionales","body":["Objetivos 1 al 5","Gestión pedagógica y aprendizajes: enseñanza y evaluación contextualizadas a la EPJA.","Acceso, permanencia y trayectoria: seguimiento, apoyo y prevención del abandono.","Formación TP y empleabilidad: práctica, articulación y vínculo con el sector productivo.","Inclusión y atención a la diversidad: eliminar barreras e igualar oportunidades.","Convivencia y bienestar integral: respeto, participación y salud mental.","Objetivos 6 al 10","Liderazgo y gestión institucional: gestión transparente y coherente con el PEI y el PME.","Desarrollo profesional y colaboración: capacitación y reflexión pedagógica.","Vinculación con redes y comunidad: alianzas que amplíen oportunidades.","Formación ciudadana y desarrollo integral: autonomía, pensamiento crítico y compromiso social.","Innovación y mejora continua: tecnologías, recursos y evaluación de resultados."],"speech":"Los diez objetivos estratégicos conectan la enseñanza con las trayectorias, la formación técnica, la inclusión y la convivencia. A ello se suman liderazgo, desarrollo profesional, redes, ciudadanía e innovación. Son prioridades que deben reflejarse en la planificación institucional."},{"tag":"PROFUNDIZACIÓN","title":"Convivencia y apoyo psicosocial","body":["Documento anterior","Buen trato y respeto por la diversidad","Resolución pacífica de conflictos","Reglamento y sentido de pertenencia","Documento actualizado","Apartado específico de apoyo psicosocial","Acompañamiento y estrategias de intervención","Coordinación y derivación a redes","Seguimiento del bienestar y la permanencia"],"speech":"El nuevo proyecto profundiza el apoyo psicosocial y la convivencia educativa. El acompañamiento, la intervención coordinada y la derivación a redes contribuyen a construir espacios seguros y a sostener las trayectorias de aprendizaje."},{"tag":"CONVIVENCIA Y APOYO PSICOSOCIAL","title":"Siete líneas de acción institucionales","body":["Prevenir y detectar","Prevención y promoción: talleres y campañas sobre buen trato, inclusión, respeto y bienestar.","Detección temprana: seguimiento de asistencia, entrevistas y factores de riesgo.","Acompañamiento individual: entrevistas, orientación y seguimiento de quienes requieren apoyo.","Intervención ante conflictos: aplicación del RICE, protocolos y medidas formativas.","Sostener y vincular","Revinculación educativa: contacto con estudiantes de inasistencia reiterada y acuerdos de retorno.","Trabajo en red: coordinación con servicios públicos y organismos especializados.","Participación comunitaria: diálogo y colaboración para fortalecer el sentido de pertenencia."],"speech":"Las siete líneas de acción incluyen prevención, detección temprana, acompañamiento individual, intervención ante conflictos, revinculación, trabajo en red y participación comunitaria. Su coordinación permite abordar las situaciones de manera oportuna y formativa."},{"tag":"RESPONSABILIDADES","title":"Quién hace qué en el acompañamiento","body":["Dirección y equipos de apoyo","Dirección: lidera la convivencia, garantiza la normativa y los protocolos, coordina medidas de resguardo.","Encargado/a de Convivencia: coordina el plan, promueve acciones preventivas y hace seguimiento.","Dupla Psicosocial: detecta, orienta, acompaña y coordina derivaciones y redes de apoyo.","Aula, inspectoría y UTP","Docentes y profesores jefes: observan y comunican oportunamente, promueven el buen trato y colaboran en el acompañamiento.","Inspectoría: apoya el funcionamiento cotidiano, informa situaciones y colabora en el seguimiento.","UTP y profesionales PIE: identifican y abordan barreras para el aprendizaje y la participación."],"speech":"Cada equipo tiene responsabilidades complementarias. Dirección lidera; Convivencia organiza y monitorea; la dupla psicosocial acompaña y orienta; docentes e Inspectoría detectan y comunican situaciones; la unidad técnico pedagógica y el programa de integración abordan barreras de aprendizaje."},{"tag":"PARTICIPACIÓN","title":"Participación con mayor desarrollo","body":["Documento anterior","Reconoce una elaboración participativa","Identifica asesores del Centro de Alumnos","Detecta necesidad de fortalecer el debate","Documento actualizado","Desarrolla el Centro de Estudiantes","Define órganos y espacios colegiados","Considera las distintas jornadas de EPJA","Incorpora acuerdos y seguimiento"],"speech":"La participación se fortalece mediante espacios estudiantiles y colegiados adecuados a las distintas jornadas. El desafío es recoger las propuestas de la comunidad, establecer acuerdos y realizar seguimiento de su desarrollo."},{"tag":"PARTICIPACIÓN","title":"Instancias de participación y su aporte al PEI","body":["INSTANCIA","PROPÓSITO PRINCIPAL","CONTRIBUCIÓN AL PEI","Centro de Estudiantes","Representar al estudiantado y promover iniciativas.","Fortalece la participación y el liderazgo.","Consejo Escolar","Facilitar la participación y consulta de la comunidad.","Contribuye a la reflexión y mejora institucional.","Consejo de Profesores","Analizar y fortalecer los procesos pedagógicos.","Favorece los aprendizajes y el desarrollo docente.","Equipo de Gestión","Coordinar la planificación y evaluación institucional.","Articula objetivos, acciones y resultados.","Consejo de Curso y otras instancias estudiantiles","Promover el diálogo y la colaboración entre estudiantes.","Refuerza la convivencia y el sentido de pertenencia."],"speech":"El Centro de Estudiantes, el Consejo Escolar, el Consejo de Profesores, el Equipo de Gestión y los consejos de curso aportan perspectivas distintas. En conjunto, permiten fortalecer la participación, la planificación, los aprendizajes y el sentido de pertenencia."},{"tag":"FORMACIÓN PARA EL TRABAJO","title":"Formación técnica con seguimiento","body":["La oferta permanece","Técnico de Nivel Medio en Electricidad","Técnico de Nivel Medio en Atención de Párvulos","El desarrollo se amplía","Articulación entre teoría y práctica","Seguridad y responsabilidad profesional","Prácticas, titulación y seguimiento","Vinculación con el entorno productivo"],"speech":"Las especialidades de Electricidad y Atención de Párvulos mantienen su oferta formativa. La actualización profundiza la articulación entre teoría y práctica, la seguridad, las prácticas profesionales, la titulación y la relación con el entorno productivo."},{"tag":"FORMACIÓN TÉCNICO-PROFESIONAL","title":"Las dos especialidades y sus competencias","body":["Técnico de Nivel Medio en Electricidad","Ejecutar labores propias de instalaciones eléctricas.","Interpretación de planos, montaje, revisión y mantenimiento de instalaciones.","Uso adecuado de herramientas y equipos, con aplicación de normas de seguridad.","Resolver problemas técnicos y aplicar procedimientos según la normativa del sector.","Técnico de Nivel Medio en Atención de Párvulos","Colaborar en la atención y educación integral de niños y niñas.","Apoyar experiencias de aprendizaje, actividades lúdicas y hábitos de higiene.","Resguardar bienestar, seguridad y desarrollo infantil según protocolos.","Buen trato, empatía y compromiso con los derechos de la infancia."],"speech":"Electricidad prepara para interpretar planos, montar y mantener instalaciones, aplicar procedimientos y resolver problemas técnicos con seguridad. Atención de Párvulos desarrolla competencias para apoyar experiencias de aprendizaje y resguardar el bienestar y los derechos de niños y niñas."},{"tag":"FORMACIÓN TÉCNICO-PROFESIONAL","title":"Seis estrategias para desarrollarla","body":["Aprender haciendo","a) Aprendizaje práctico y contextualizado: talleres, simulaciones y experiencias vinculadas al mundo laboral.","b) Articulación curricular: coordinación entre docentes de formación general y de especialidad.","c) Vinculación con el entorno productivo: convenio con Tecelec y Red Futuro Técnico.","Acompañar y evaluar","d) Acompañamiento de trayectorias: seguimiento de desempeño, asistencia y avance para evitar interrupciones.","e) Competencias transversales: comunicación, responsabilidad, colaboración e iniciativa.","f) Evaluación para el aprendizaje: procedimientos teóricos y prácticos con retroalimentación oportuna."],"speech":"Las estrategias de formación técnica combinan aprendizaje práctico, articulación curricular, redes productivas, acompañamiento de trayectorias, competencias transversales y evaluación formativa. Así se fortalece la relación entre la experiencia escolar y el mundo laboral."},{"tag":"VINCULACIÓN CON EL ENTORNO","title":"Redes con propósitos identificados","body":["Documento anterior","Reconoce el uso de redes existentes","Las relaciona con el proyecto educativo","Documento actualizado","Nombra redes y convenios específicos","Relaciona cada vínculo con su aporte","Define responsables y evidencias","Propone evaluar sus resultados"],"speech":"La vinculación territorial adquiere mayor precisión. Se identifican redes y convenios, sus propósitos y la necesidad de evaluar sus aportes. De esta forma, la colaboración externa se conecta con necesidades educativas concretas."},{"tag":"REDES Y CONVENIOS","title":"Con quién trabajamos y para qué","body":["Sostenedor y redes educativas","SLEP Los Álamos: gestión institucional, apoyo técnico-pedagógico y mejoramiento.","UATP y redes de apoyo educativo: prácticas pedagógicas, gestión curricular y acompañamiento docente.","Red Achibueno: trabajo colaborativo e intercambio de experiencias.","Red Futuro Técnico: fortalecimiento de la EMTP y vínculo con instituciones.","Convenio con Tecelec: vinculación con el entorno productivo de Electricidad.","Territorio y protección de derechos","Centro Penitenciario de Parral: colaboración educativa y oportunidades de aprendizaje.","Redes de salud y vida saludable: autocuidado, prevención y bienestar.","Municipalidad y organismos públicos: apoyos, actividades comunitarias y participación.","Empresas del sector productivo: formación práctica y conocimiento del mundo laboral.","Redes psicosociales y de derechos: orientación, acompañamiento y derivación."],"speech":"El proyecto reconoce la colaboración con el sostenedor, redes educativas, Red Futuro Técnico y Tecelec. También contempla organismos públicos, redes de salud, el Centro Penitenciario de Parral y empresas, buscando ampliar oportunidades de aprendizaje y apoyo."},{"tag":"METAS DECLARADAS","title":"Metas pedagógicas más específicas","body":["PEI anterior","100% de docentes con prácticas coherentes","con el modelo pedagógico diseñado","Actualización","100% de planificación contextualizada EPJA","100% de asignaturas con evaluación diversificada","Al menos 85% de aprobación","Dos acompañamientos docentes por semestre"],"speech":"En gestión pedagógica se establecen metas específicas: planificación contextualizada, evaluación diversificada, aprobación y acompañamiento docente. Estos compromisos permiten transformar los objetivos en acciones observables."},{"tag":"METAS COMPROMETIDAS","title":"Gestión Pedagógica y Liderazgo: metas completas","body":["Área de Gestión Pedagógica","100% de planificación docente alineada a las Bases Curriculares de EPJA y contextualizada.","Al menos 85% de estudiantes aprueba sus módulos o asignaturas en cada período lectivo.","Evaluación diversificada aplicada en el 100% de las asignaturas.","Incremento de 20% en los niveles de logro de evaluaciones internas.","Al menos 2 acompañamientos pedagógicos semestrales (observación y retroalimentación).","Área de Gestión: Liderazgo","Sistema de monitoreo trimestral del PME y del PEI con evidencias verificables.","Al menos 4 reuniones anuales de análisis institucional centradas en resultados.","100% del equipo directivo participa en instancias de formación continua.","Reuniones técnicas mensuales de Consejo de Profesores y UTP.","Satisfacción interna sobre el liderazgo superior al 80% (medición anual)."],"speech":"Las metas de gestión pedagógica incluyen aprobación de al menos ochenta y cinco por ciento, dos acompañamientos semestrales y mejora de los logros internos. En liderazgo, se incorpora monitoreo trimestral, reuniones de análisis, formación continua y evaluación de satisfacción."},{"tag":"METAS DECLARADAS","title":"Resultados y trayectorias medibles","body":["Una dimensión adicional","El anterior organiza metas en cuatro áreas","El nuevo incorpora el área de Resultados","≥75%","Asistencia promedio anual","100%","Seguimiento de trayectorias","−20%","Deserción escolar","+15%","Titulación/certificación"],"speech":"El área de resultados incorpora metas sobre asistencia, seguimiento, deserción y titulación. La asistencia anual debe alcanzar al menos setenta y cinco por ciento; se propone seguimiento para todos los estudiantes, reducir la deserción y aumentar la titulación."},{"tag":"GESTIÓN INSTITUCIONAL","title":"Liderazgo y condiciones para aprender","body":["Metas anteriores","Liderazgo: altas expectativas en 80% de docentes","Recursos: evaluar y retroalimentar al 100%","del equipo docente","Metas actualizadas","Monitoreo trimestral del PME y PEI","Cuatro reuniones anuales de análisis","Recursos adecuados para al menos 90% de docentes","Dos mejoras anuales de infraestructura/equipamiento"],"speech":"El liderazgo y los recursos se relacionan directamente con las condiciones para aprender. El monitoreo trimestral, las reuniones institucionales y las mejoras en equipamiento e infraestructura permiten observar avances y priorizar necesidades."},{"tag":"METAS COMPROMETIDAS","title":"Convivencia y Recursos: metas completas","body":["Área de Gestión: Convivencia","Reducir en 20% los casos de conflictos de convivencia registrados al año.","Al menos 3 acciones formativas semestrales en convivencia y habilidades socioemocionales.","90% de percepción positiva del clima escolar en encuestas institucionales.","Plan de acompañamiento socioemocional para estudiantes en riesgo (cobertura ≥ 80%).","Activación del 100% de los protocolos del Reglamento Interno cuando corresponda.","Área de Gestión: Recursos","Ejecutar el 100% del presupuesto anual conforme a planificación y normativa.","Registro actualizado y transparente de ingresos y gastos, con rendición oportuna.","Al menos 90% de los docentes con recursos pedagógicos adecuados para su labor.","Al menos 2 mejoras concretas anuales en infraestructura y equipamiento.","Funcionamiento continuo de SIGE, asistencia y registros académicos."],"speech":"En convivencia, las metas incluyen disminuir conflictos, desarrollar acciones formativas y acompañar a estudiantes en riesgo. En recursos, se busca una ejecución presupuestaria coherente, registros transparentes y condiciones pedagógicas adecuadas."},{"tag":"METAS COMPROMETIDAS","title":"Resultados: el área que se agrega","body":["Área de Gestión: Resultados","Incrementar en 15% la tasa anual de titulación o certificación.","Disminuir en 20% la tasa de deserción escolar.","Asistencia promedio anual igual o superior a 75%.","Sistema de seguimiento de trayectorias para el 100% de los estudiantes.","Reportes semestrales de resultados académicos y de gestión, analizados.","Cómo leeremos el cumplimiento","Cumplimiento alto: 90% a 100% de logro.","Cumplimiento adecuado: 75% a 89% de logro.","Cumplimiento parcial: 50% a 74% de logro.","Cumplimiento bajo: menos de 50% de logro."],"speech":"En resultados, se propone incrementar la titulación o certificación en quince por ciento, disminuir la deserción en veinte por ciento y alcanzar una asistencia promedio anual de setenta y cinco por ciento. Se establecen niveles de cumplimiento para interpretar los avances."},{"tag":"SEGUIMIENTO DEL PEI","title":"Un calendario explícito de evaluación","body":["El anterior declara evaluación permanente y mejoramiento continuo","TRIMESTRAL","Revisión de indicadores","SEMESTRAL","Análisis pedagógico","y convivencia","ANUAL","Evaluación global","e informe","EXTRAORDINARIA","Ajustes ante cambios","relevantes"],"speech":"El seguimiento contempla una revisión trimestral de indicadores, un análisis semestral pedagógico y de convivencia, y una evaluación global anual. También permite ajustes extraordinarios cuando surjan cambios relevantes."},{"tag":"SEGUIMIENTO DEL PEI","title":"Indicadores, evidencias y periodicidad","body":["DIMENSIÓN","INDICADOR DE CUMPLIMIENTO","MEDIO DE VERIFICACIÓN","PERIODICIDAD","Gestión institucional","Objetivos y acciones del PEI ejecutados sobre lo planificado.","Informes de gestión, actas y registros.","Trimestral","Gestión pedagógica","Estudiantes aprobados y evolución de los aprendizajes.","Actas de calificaciones e informes UTP.","Semestral","Acceso y permanencia","Variación de matrícula, asistencia y permanencia.","Registros de matrícula y seguimiento.","Mensual y semestral","Inclusión educativa","Acciones de apoyo e inclusión ejecutadas.","Registros PIE e informes de apoyo.","Semestral","Convivencia y bienestar","Actividades de convivencia y participación realizadas.","Plan de Convivencia, actas y registros.","Semestral","Formación TP","Actividades prácticas y de articulación ejecutadas.","Planificaciones, talleres y convenios.","Semestral","Redes y convenios","Acciones de colaboración con redes ejecutadas.","Convenios, actas e informes.","Anual"],"speech":"Cada dimensión dispone de indicadores, evidencias y una periodicidad. Los informes de gestión, registros de matrícula, calificaciones, evidencias de apoyo, actas y convenios permiten respaldar el seguimiento de las acciones."},{"tag":"SEGUIMIENTO DEL PEI","title":"Evidencias para orientar las decisiones","body":["Información que se recoge","Asistencia, permanencia y aprobación","Aprendizajes y apoyos educativos","Participación, prácticas y redes","Uso de los resultados","Comparar avances con metas y línea de base","Identificar brechas y sus causas","Definir mejoras, responsables y plazos","Incorporar conclusiones al PME"],"speech":"La información recogida debe convertirse en decisiones. Se propone comparar avances con metas y líneas de base, identificar brechas, asignar responsables y plazos e incorporar las conclusiones a la planificación del mejoramiento educativo."},{"tag":"GESTIÓN DEL DOCUMENTO","title":"Actualización y aprobación documentadas","body":["Documento anterior","Presenta un horizonte 2022–2027","Reconoce participación y mejora continua","Documento actualizado","Registro de modificaciones y fundamentos","Revisión y participación institucional","Aprobación, versión y respaldo en acta","Difusión a la comunidad educativa"],"speech":"La actualización del proyecto considera registrar las modificaciones, fundamentar sus cambios, promover la participación institucional y respaldar su aprobación. Una adecuada difusión facilita la apropiación por parte de toda la comunidad."},{"tag":"INSTRUMENTOS DE GESTIÓN","title":"Nueve instrumentos articulados con el PEI","body":["Gestión y convivencia","PEI: define identidad, visión, misión, principios, objetivos y sellos.","PME: convierte los propósitos del PEI en acciones medibles y evaluables.","Plan de Gestión de la Convivencia: buen trato, prevención de conflictos y bienestar.","Plan de Formación Ciudadana: participación democrática, derechos y deberes.","PISE: prevención, preparación y respuesta ante emergencias.","Inclusión, personas y trabajo","Plan de Sexualidad, Afectividad y Género: respeto, igualdad y prevención de riesgos.","Plan de Apoyo a la Inclusión: acceso, participación y eliminación de barreras.","Plan de Desarrollo Profesional Docente: competencias profesionales y prácticas pedagógicas.","Plan de Formación TP y vinculación: desarrolla el sello “Formación para el trabajo”."],"speech":"El proyecto educativo se articula con los instrumentos de planificación y gestión institucional. Entre ellos se encuentran el Plan de Mejoramiento Educativo, los planes de convivencia, formación ciudadana, seguridad, inclusión, desarrollo profesional y formación técnica."},{"tag":"PROYECCIONES INSTITUCIONALES","title":"Diez áreas de mejoramiento y lo que esperamos lograr","body":["Gestión y aprendizajes","Gestión y liderazgo directivo → mayor coherencia entre PEI, PME y planes institucionales.","Gestión pedagógica → mejora progresiva de los aprendizajes y resultados académicos.","Asistencia y permanencia → más permanencia y menos deserción.","Inclusión y diversidad → más participación y acceso a apoyos pertinentes.","Convivencia y bienestar → mejor clima, participación y sentido de pertenencia.","Condiciones y vinculación","Formación técnico-profesional → competencias técnicas y mejores oportunidades laborales.","Desarrollo profesional → fortalecimiento de las prácticas institucionales.","Infraestructura y recursos → ambientes de aprendizaje adecuados, accesibles y seguros.","Redes y vinculación territorial → más oportunidades educativas, sociales y laborales.","Seguimiento y evaluación → decisiones basadas en evidencia."],"speech":"Las proyecciones institucionales abarcan diez áreas, desde gestión y aprendizajes hasta infraestructura, redes y evaluación. Todas apuntan a fortalecer las trayectorias de nuestros estudiantes y las condiciones en que se desarrolla su educación."},{"tag":"PROPUESTA PARA CONVERSAR","title":"Prioridades para la puesta en práctica","body":["Acuerdos de implementación","Socializar el PEI en ambas jornadas","Precisar metas, fórmulas y líneas de base","Asignar responsables en la planificación anual","Primer seguimiento","Revisar la articulación con el PME","Calendarizar instancias de evaluación","Completar la versión y los respaldos","Informar avances a la comunidad"],"speech":"Para poner el proyecto en práctica, proponemos socializarlo en las distintas jornadas, precisar indicadores y líneas de base, asignar responsabilidades y calendarizar el seguimiento. Estos son puntos de trabajo para definir colectivamente."},{"tag":"COMUNIDAD EDUCATIVA","title":"Conclusiones y diálogo","body":["LA IDENTIDAD SE MANTIENE","Profundiza los apoyos y las responsabilidades","Desarrolla la formación técnica y las redes","Hace más explícito el seguimiento","Pregunta para la comunidad","¿Qué cambio debemos priorizar para favorecer la permanencia y el aprendizaje de nuestros estudiantes?"],"speech":"Concluimos con una idea central: nuestra identidad se mantiene y la actualización profundiza la forma en que organizamos el acompañamiento, las responsabilidades y la evaluación. Invitamos a la comunidad a reflexionar: ¿qué cambio debemos priorizar para favorecer la permanencia y el aprendizaje de nuestros estudiantes?"}];const $=id=>document.getElementById(id);let i=0;const audio=$('audio');function show(){const s=slides[i];$('tag').textContent=s.tag;$('title').textContent=s.title;$('count').textContent=(i+1)+' / '+slides.length;$('fill').style.width=(i+1)/slides.length*100+'%';$('speech').textContent=s.speech;$('body').className=s.body.length>12?'dense':'';$('body').replaceChildren(...s.body.map(x=>{let el=document.createElement('div');el.className='item';el.textContent=x;return el}));$('jump').value=i;$('prev').disabled=!i;$('next').disabled=i===43;audio.src='audio/'+String(i+1).padStart(2,'0')+'.mp3';$('status').textContent='Locución profesional · Rodrigo Dufey';}function play(){audio.play().catch(()=>{$('status').textContent='No se encontró el audio de esta diapositiva. Comprueba la carpeta audio.'})}function go(n){const live=!audio.paused;i=Math.max(0,Math.min(43,n));show();if(live)play()}audio.addEventListener('ended',()=>{if($('auto').checked&&i<43){i++;show();play()}else $('status').textContent=i===43?'Presentación finalizada.':'Narración finalizada.'});audio.addEventListener('error',()=>{$('status').textContent='Archivo de audio no disponible.'});audio.onplay=()=>{$('play').textContent='Pausar'};audio.onpause=()=>{$('play').textContent='Reproducir'};$('play').onclick=()=>audio.paused?play():audio.pause();$('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);$('jump').replaceChildren(...slides.map((s,j)=>new Option((j+1)+' · '+s.title,j)));$('jump').onchange=()=>go(Number($('jump').value));$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();show();</script></body></html>
